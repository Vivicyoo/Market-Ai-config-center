<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 能力配置中心 · 集集智创台</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --panel-3:#f0f2f5;
  --border:#e3e6ea; --border-strong:#cfd4db;
  --text:#1c2027; --text-2:#525b68; --text-3:#5d6875;
  --accent:#2563eb; --accent-soft:#eef4ff; --accent-line:#bcd3ff;
  --ok:#16a34a; --ok-soft:#eafaf0; --ok-line:#b6e7c9;
  --warn:#d97706; --warn-soft:#fff8ec; --warn-line:#f6dfb2;
  --danger:#dc2626; --danger-soft:#fef1f1; --danger-line:#f7c9c9;
  --purple:#7c3aed; --purple-soft:#f5f0ff; --purple-line:#ddd0fa;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#15171c; --panel:#1c1f26; --panel-2:#22262e; --panel-3:#272c35;
  --border:#2e333d; --border-strong:#3d4450;
  --text:#e7e9ee; --text-2:#adb5c2; --text-3:#8a94a4;
  --accent:#4d8dfb; --accent-soft:#1b2739; --accent-line:#2f4a75;
  --ok:#3ecf8e; --ok-soft:#16281f; --ok-line:#28503c;
  --warn:#e0a458; --warn-soft:#2a2317; --warn-line:#4d3f22;
  --danger:#f2555a; --danger-soft:#2c1a1c; --danger-line:#552b2f;
  --purple:#a78bfa; --purple-soft:#231c33; --purple-line:#413360;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6f9dff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px}
.brand h1{font-size:15.5px;font-weight:600;letter-spacing:.2px}
.brand p{font-size:12.5px;color:var(--text-3);line-height:1.2}
.topbar-right{display:flex;align-items:center;gap:10px}
.env-tag{font-size:12.5px;padding:3px 9px;border-radius:20px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line);font-weight:500}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15.5px;background:var(--panel-2)}
.icon-btn:hover{border-color:var(--border-strong);background:var(--panel-3)}

.layout{display:flex;height:calc(100vh - 101px)}
.pagenav{height:45px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px}
.sidebar{width:334px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sb-head{padding:12px 12px 8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.search-box{position:relative}
.search-box input{width:100%;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel-2);padding:0 10px 0 29px;outline:none;font-size:14px}
.search-box input:focus{border-color:var(--accent);background:var(--panel)}
.search-box::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:16.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s;white-space:nowrap}
.chip:hover{border-color:var(--border-strong)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chip.role.on{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple)}
.filter-row{display:flex;align-items:flex-start;gap:6px}
.filter-label{font-size:12px;color:var(--text-3);flex-shrink:0;width:36px;padding-top:5px;line-height:1.35}

.tree{flex:1;overflow-y:auto;padding:6px 8px 10px}
.grp{margin-bottom:2px}
.grp-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;user-select:none}
.grp-head:hover{background:var(--panel-3)}
.grp-head .arw{font-size:10.5px;color:var(--text-3);transition:transform .15s;display:inline-block;width:10px}
.grp.collapsed .arw{transform:rotate(-90deg)}
.grp.collapsed .grp-body{display:none}
.grp-count{font-size:11.5px;color:var(--text-3);margin-left:auto;font-weight:400}
.fitem{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 22px;border-radius:6px;cursor:pointer;font-size:14px;position:relative;border:1px solid transparent}
.fitem:hover{background:var(--panel-3)}
.fitem.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--danger)} .dot.none{background:var(--border-strong)}
.fitem-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem-meta{font-size:11.5px;color:var(--text-3);font-family:var(--mono);flex-shrink:0}
.fitem.on .fitem-meta{color:var(--accent);opacity:.8}
.sb-foot{border-top:1px solid var(--border);padding:9px 12px;background:var(--panel-2);display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-3)}
.stat-row{display:flex;justify-content:space-between;align-items:center}
.stat-row b{color:var(--text);font-weight:600;font-family:var(--mono);font-size:13px}
.bar{height:4px;border-radius:3px;background:var(--panel-3);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5fd39a);border-radius:3px}

.panel{flex:1;overflow-y:auto;padding:15px 18px 82px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-3);gap:8px}
.empty .big{font-size:34px;opacity:.35}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.card-head .no{width:19px;height:19px;border-radius:5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-head h2{font-size:15px;font-weight:600}
.card-head .sub{font-size:12.5px;color:var(--text-3);margin-left:auto;text-align:right}
.card-body{padding:14px}

/* 顶部身份区：功能名 + 状态章 + 积分区间 + 元信息条（分组 / 角色 / 模板 / ID 分栏展示） */
.page-head{margin-bottom:12px}
.ph-top{display:flex;align-items:center;gap:12px}
.ph-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.ph-title h1{font-size:21px;font-weight:600;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-score{margin-left:auto;display:flex;align-items:baseline;gap:6px;white-space:nowrap;flex-shrink:0}
.ph-score .k{font-size:13px;color:var(--text-3)}
.ph-score .v{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--accent);line-height:1.1}
.ph-score .u{font-size:13px;color:var(--text-3)}
.ph-meta{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.ph-meta > div{display:flex;align-items:center;gap:8px;padding-right:18px;margin-right:18px;border-right:1px solid var(--border)}
.ph-meta > div:last-child{border-right:none;margin-right:0;padding-right:0}
.ph-meta dt{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.ph-meta dd{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:500;flex-wrap:wrap}
.mk{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:5px;background:var(--panel-3);border:1px solid var(--border-strong);color:var(--text);white-space:nowrap}
.mk.purple{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple)}
.mk.mono{font-family:var(--mono);color:var(--text-3)}
.mk.none{color:var(--warn);border-style:dashed}

.badge{font-size:12px;padding:3px 9px;border-radius:5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge.gray{background:var(--panel-3);color:var(--text-2);border-color:var(--border)}
.badge.blue{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.badge.green{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.badge.amber{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge.red{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.badge.purple{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-size:13px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:5px}
.hint{font-size:12px;color:var(--text-3);line-height:1.5}
.inp,select.inp{height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel-2);padding:0 10px;outline:none;font-size:14px;width:100%;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.inp:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.inp:disabled{opacity:.45;cursor:not-allowed}
.inp.ro{background:var(--panel-3);color:var(--text-2);cursor:default}

.check-list{display:flex;flex-wrap:wrap;gap:6px}
.tick{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);cursor:pointer;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s;user-select:none}
.tick:hover{border-color:var(--border-strong)}
.tick.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.tick i{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--border-strong);display:inline-block;flex-shrink:0;position:relative}
.tick.on i{background:var(--accent);border-color:var(--accent)}
.tick.on i::after{content:"";position:absolute;left:2.5px;top:.5px;width:4px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}

.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch .track{width:34px;height:19px;border-radius:11px;background:var(--border-strong);position:relative;transition:background-color .16s;flex-shrink:0}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on .track{background:var(--accent)}
.switch.on .track::after{transform:translateX(15px)}

.slots{display:flex;flex-direction:column;gap:11px}
.slot{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);padding:10px 12px}
.slot-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.slot-top .nm{font-size:13.5px;font-weight:600}
.slot-top .fam{font-size:12px;color:var(--text-3)}
.slot-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px 16px;align-items:start}
.model-info{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:5px;background:var(--panel-3);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.tag.k{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tag.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.tag.w{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}

.fallback-list{display:flex;flex-direction:column;gap:6px}
.fb-row{display:flex;align-items:center;gap:7px}
.fb-row .idx{width:18px;height:18px;border-radius:5px;background:var(--panel-3);border:1px solid var(--border);font-size:11.5px;display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-shrink:0}
.mini-btn{font-size:12.5px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);white-space:nowrap}
.tick-add{display:inline-flex;align-items:center;font-size:12.5px;padding:5px 10px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--text-3);cursor:pointer;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
.tick-add:hover{color:var(--accent);border-color:var(--accent)}
.mini-btn:hover{border-color:var(--border-strong);color:var(--text)}
.mini-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mini-btn.danger:hover{border-color:var(--danger-line);color:var(--danger);background:var(--danger-soft)}

.diff-bar{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-size:13px;margin-bottom:12px;line-height:1.7}
.diff-bar.hide{display:none}
.diff-bar .ico{flex-shrink:0;font-size:13.5px}
.diff-bar b{font-weight:600}
.diff-bar .x{margin-left:auto;cursor:pointer;opacity:.6;flex-shrink:0}
.diff-bar .x:hover{opacity:1}

.opt-wrap{display:flex;flex-wrap:wrap;gap:4px;max-width:290px}
.ops{font-size:12px;padding:2.5px 7px;border-radius:4px;background:var(--panel-3);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.ops.now{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.ops.new{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok);font-weight:500}
.muted{color:var(--text-3);font-size:12px}
.inline-sel{height:29px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);padding:0 6px;font-size:13px;outline:none;max-width:190px;cursor:pointer}
.inline-sel:focus{border-color:var(--accent)}
.inline-num{height:29px;width:82px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);padding:0 7px;font-size:13px;outline:none;font-family:var(--mono)}
.inline-num:focus{border-color:var(--accent)}
.eye{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);font-size:13.5px;display:flex;align-items:center;justify-content:center}
.eye.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* 卡片内部子区（用于把一个 card 拆成多个语义分组） */
.sub-section{margin-bottom:13px}
.sub-section:last-child{margin-bottom:0}
.sub-head{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:9px;display:flex;align-items:center;gap:9px;letter-spacing:.5px;text-transform:uppercase}
.sub-head::after{content:"";flex:1;height:1px;background:var(--border);border-top:1px dashed var(--border)}
.section-divider{margin:13px -14px;height:1px;border-top:1px dashed var(--border);background:transparent}

/* 参数卡片列表（取代原 table） */
.param-list{display:flex;flex-direction:column;gap:8px}
.param-card{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);padding:11px 13px;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
.param-card:hover{border-color:var(--border-strong)}
.param-card.unsupported{opacity:.6}
.param-card.unsupported:hover{border-color:var(--border)}
.param-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);margin-bottom:9px}
.param-label{font-size:14.5px;font-weight:600;flex:1;display:flex;align-items:baseline;gap:8px;min-width:0}
.param-label .key{font-family:var(--mono);font-size:12px;color:var(--text-3);font-weight:400}
.param-label .req{color:var(--danger);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.param-tags{display:flex;gap:5px;align-items:center}
.param-body{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,1.5fr);gap:14px 18px;align-items:start}
.param-current,.param-options{display:flex;flex-direction:column;gap:7px;min-width:0}
.param-current > label,.param-options > label{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.param-current .ctrl-wrap{display:flex;align-items:center;gap:7px;min-height:29px}
.param-foot{display:flex;align-items:center;gap:14px;padding-top:8px;margin-top:9px;border-top:1px dashed var(--border);font-size:13px;flex-wrap:wrap}
.param-foot .lbl{color:var(--text-3);font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.param-foot .v{color:var(--warn);font-family:var(--mono);font-weight:600}
.param-foot .v.zero{color:var(--text-3);font-weight:400}
.param-foot .meta{color:var(--text-2);font-family:var(--mono)}

/* 状态信息条（替代原 readonly 表单字段） */
.status-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:12px}
.status-pill{font-size:12.5px;padding:5px 10px;border-radius:6px;background:var(--panel-3);border:1px solid var(--border);color:var(--text-2);display:inline-flex;align-items:center;gap:7px}
.status-pill b{color:var(--accent);font-family:var(--mono);font-weight:600}
.status-pill .dim{color:var(--text-3);font-size:12px}

.front-preview{margin-top:13px;padding:11px 12px;border-radius:var(--radius-sm);border:1px dashed var(--border-strong);background:var(--panel-2)}
.front-preview .t{font-size:12.5px;color:var(--text-3);margin-bottom:9px}
.ctrl-mock{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
.mock-field{display:flex;flex-direction:column;gap:4px}
.mock-field span{font-size:12px;color:var(--text-3)}
.mock-field .box{height:27px;min-width:88px;border-radius:6px;border:1px solid var(--border);background:var(--panel);padding:0 8px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--text-2)}

.formula{font-family:var(--mono);font-size:14px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--panel-3);border:1px solid var(--border);line-height:1.9;overflow-x:auto}
.formula .v{color:var(--accent);font-weight:600}
.formula .o{color:var(--warn);font-weight:600}
.formula .m{color:var(--purple);font-weight:600}
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.steps{display:flex;flex-direction:column;min-width:0}
.step{display:flex;align-items:center;gap:10px;padding:7px 11px;font-size:13.5px;border:1px solid var(--border);border-bottom:none;background:var(--panel-2);min-width:0}
.step:first-child{border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.step:last-child{border-bottom:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm)}
.step .lb{color:var(--text-2);flex:1}
.step .lb small{display:block;font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.step .vl{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--warn)}
.step .vl.zero{color:var(--text-3);font-weight:400}
.step.sum{background:var(--accent-soft);border-color:var(--accent-line)}
.step.sum .lb{color:var(--accent);font-weight:600}
.step.sum .vl{color:var(--accent)}
.result-box{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius);padding:16px;text-align:center}
.result-box .n{font-size:34px;font-weight:700;color:var(--accent);font-family:var(--mono);line-height:1.1}
.result-box .u{font-size:13.5px;color:var(--accent);opacity:.85;margin-top:2px}
.result-box .rm{margin-top:11px;padding-top:11px;border-top:1px dashed var(--accent-line);display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.result-box .rm div{display:flex;justify-content:space-between}
.result-box .rm span{color:var(--accent);opacity:.8}
.result-box .rm b{font-family:var(--mono)}
.result-box .rm b.pos{color:var(--ok)} .result-box .rm b.neg{color:var(--danger)}
.result-box .loss{display:none;margin-top:10px;padding:7px 9px;border-radius:6px;background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);font-size:12px;text-align:left;line-height:1.55}
.result-box .loss.show{display:block}
.range-note{margin-top:10px;font-size:12.5px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.range-note div{display:flex;justify-content:space-between}
.range-note b{font-family:var(--mono);color:var(--warn)}

.actionbar{position:fixed;bottom:0;left:334px;right:0;height:62px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px;z-index:15;box-shadow:0 -2px 10px rgba(16,24,40,.06)}
.actionbar .status{font-size:13px;color:var(--text-3);flex:1;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{height:36px;padding:0 17px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;border:1px solid var(--border);background:var(--panel-2);color:var(--text);transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
.btn:hover{border-color:var(--border-strong);background:var(--panel-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.drawer-mask{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:40;display:none}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--panel);z-index:41;border-left:1px solid var(--border);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-head h3{font-size:14.5px;font-weight:600;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px}
.hist{padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:9px;background:var(--panel-2)}
.hist-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hist-top b{font-size:13.5px}
.hist-top .ts{font-size:12px;color:var(--text-3);font-family:var(--mono);margin-left:auto}
.hist-diff{font-family:var(--mono);font-size:12px;color:var(--text-2);line-height:1.75;background:var(--panel-3);border-radius:5px;padding:7px 9px;border:1px solid var(--border);max-height:170px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--panel);padding:9px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .22s,transform .22s;z-index:60;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 备用模型降级链（空态收敛，避免一排空下拉撑高卡片） */
.fb-empty{font-size:13px;color:var(--text-3);border:1px dashed var(--border);border-radius:6px;padding:10px 12px;text-align:center}
.fallback-list.scroll{max-height:154px;overflow:auto;padding-right:3px}
.icon-x{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-3);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-x:hover{border-color:var(--danger-line);color:var(--danger);background:var(--danger-soft)}

/* 开关放在字段格里时与输入框同高，避免行基线错位 */
.ctrl-line{height:34px;display:flex;align-items:center;gap:9px}
.switch-txt{font-size:14px;color:var(--text-2)}

/* 卡片内部的小节标题（比 sub-head 更轻，用于块内分组） */
.block-cap{font-size:12.5px;color:var(--text-3);font-weight:600;letter-spacing:.4px;margin-bottom:8px}

/* ===== 助手工具配置对象（第二类配置对象） ===== */
.obj-tabs{display:flex;gap:4px;background:var(--panel-3);padding:3px;border-radius:8px;margin-bottom:10px}
.obj-tab{flex:1;text-align:center;font-size:13px;padding:6px 4px;border-radius:6px;color:var(--text-2);cursor:pointer;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s;white-space:nowrap;user-select:none}
.obj-tab:hover{color:var(--text)}
.obj-tab.on{background:var(--panel);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.obj-tab .n{font-size:12px;color:var(--text-3);margin-left:4px;font-family:var(--mono)}
.obj-tab.on .n{color:var(--accent)}

.ro-mono{display:flex;align-items:center;gap:7px;min-width:0;height:34px;padding:0 10px;border-radius:var(--radius-sm);background:var(--panel-3);border:1px solid var(--border);font-family:var(--mono);font-size:13px;color:var(--text-2)}
.ro-mono > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro-mono .cp{font-size:12px;color:var(--text-3);cursor:pointer;flex-shrink:0}
.ro-mono .cp:hover{color:var(--accent)}

.chan{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border-radius:6px;background:var(--purple-soft);border:1px solid var(--purple-line);color:var(--purple);font-weight:500}
.chan::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.chan.off{background:var(--panel-3);border-color:var(--border);color:var(--text-3);font-weight:400}
.chan.off::before{opacity:.35}

.fork-note{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);background:var(--panel-3);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:9px 11px;line-height:1.55}
.fork-note b{color:var(--text)}

.tpl-row{display:grid;grid-template-columns:158px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--border)}
.tpl-row:last-child{border-bottom:0;padding-bottom:0}
.tpl-row:first-child{padding-top:0}
.tpl-case{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);font-weight:500;padding-top:8px;min-width:0}
.tpl-case > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-case .del{font-size:12px;color:var(--text-3);cursor:pointer;flex-shrink:0}
.tpl-case .del:hover{color:var(--danger)}
.tpl-input{width:100%;min-height:38px;resize:vertical;box-sizing:border-box;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel-2);padding:8px 10px;font-size:13.5px;font-family:inherit;line-height:1.55;color:var(--text);outline:none;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
.tpl-input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.tpl-var{font-family:var(--mono);font-size:12.5px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:4px;padding:1px 5px;margin:0 2px;cursor:pointer}
.tpl-var:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.ver-grid{grid-template-columns:minmax(260px,1fr) minmax(0,1.4fr)}
.ver-box{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);padding:12px 14px}
.ver-line{display:flex;align-items:center;gap:10px;padding:5px 0;min-width:0}
.ver-line .k{flex-shrink:0;width:92px;font-size:12.5px;color:var(--text-3)}
.ver-line .v{font-family:var(--mono);font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.snap{display:grid;grid-template-columns:100px minmax(0,1fr) 124px 64px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.snap:last-child{border-bottom:0;padding-bottom:0}
.snap.hd{padding-top:0;font-size:12.5px;color:var(--text-3);font-weight:500;border-bottom:1px solid var(--border)}
.snap .mono{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.snap.cur .mono{color:var(--accent);font-weight:500}
.link-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:6px 11px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);cursor:pointer}
.link-chip:hover{border-color:var(--accent)}

/* ===== 一级页签导航（按维护人拆分 5 页） ===== */
.page-tabs{display:flex;gap:2px;background:var(--panel-3);padding:3px;border-radius:9px}
.page-tab{font-size:13px;padding:6px 14px;border-radius:7px;color:var(--text-2);cursor:pointer;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s;white-space:nowrap;user-select:none;display:flex;align-items:center;gap:6px}
.page-tab:hover{color:var(--text)}
.page-tab.on{background:var(--panel);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.page-tab .n{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.page-tab.on .n{color:var(--accent)}
.page-tab .who{font-size:11px;color:var(--text-3);border:1px solid var(--border);padding:1px 6px;border-radius:20px}
.page-tab.on .who{color:var(--accent);border-color:var(--accent-line)}
.layout.no-sb .sidebar{display:none}
body[data-page="publish"] .actionbar{display:none!important}

/* 管理操作：树内悬浮按钮 / 侧栏管理入口 / 弹窗 */
.mgmt-bar{display:flex;gap:6px;align-items:center}
.mgmt-bar .mini-btn{height:26px;font-size:12px}
.fitem.disabled{opacity:.55}
.fitem.disabled .fitem-name{text-decoration:line-through;text-decoration-color:var(--text-3)}
.fitem .quick{display:none;gap:4px;margin-left:auto}
.fitem:hover .quick{display:flex}
.fitem .quick button{border:1px solid var(--border);background:var(--panel);border-radius:4px;font-size:11px;padding:1px 5px;cursor:pointer;color:var(--text-2);line-height:1.5}
.fitem .quick button:hover{border-color:var(--accent);color:var(--accent)}
.show-disabled{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);padding:2px 2px 0;cursor:pointer;user-select:none}
.show-disabled input{accent-color:var(--accent);margin:0}
.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:50;display:none;align-items:center;justify-content:center}
.modal-mask.open{display:flex}
.modal{width:640px;max-width:calc(100vw - 40px);max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(16,24,40,.18)}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:600}
.modal-head .x{margin-left:auto}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--panel-2);border-radius:0 0 12px 12px}
.dict-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border)}
.dict-row:last-child{border-bottom:0}
.dict-row .inp{height:30px;font-size:13px;flex:1;min-width:0}
.dict-row .cnt{font-size:12px;color:var(--text-3);font-family:var(--mono);flex-shrink:0}
.dict-row .mini-btn{height:26px;font-size:11.5px;flex-shrink:0}
.dict-row .mini-btn:disabled{opacity:.4;cursor:not-allowed}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .span2{grid-column:1/-1}

/* 计费看板 / 发布总览 */
.board{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);margin-bottom:14px;overflow:hidden}
.board-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.board-head h2{font-size:15px;font-weight:600}
.board-head .sub{font-size:12.5px;color:var(--text-3);margin-left:auto}
.board-body{padding:12px 14px}
.board-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.board-stat{flex:1;min-width:150px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);padding:10px 13px}
.board-stat .k{font-size:12px;color:var(--text-3)}
.board-stat .v{font-size:21px;font-weight:600;margin-top:2px;font-family:var(--mono)}
.board-stat .v small{font-size:12px;font-weight:400;color:var(--text-3)}
.loss-table{width:100%;border-collapse:collapse;font-size:13px}
.loss-table th{font-size:12px;color:var(--text-3);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.loss-table td{padding:7px 8px;border-bottom:1px dashed var(--border)}
.loss-table tr:last-child td{border-bottom:0}
.loss-table tbody tr{cursor:pointer;transition:background-color .1s}
.loss-table tbody tr:hover{background:var(--panel-2)}
.pub-table{width:100%;border-collapse:collapse;font-size:13px}
.pub-table th{font-size:12px;color:var(--text-3);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
.pub-table td{padding:8px;border-bottom:1px dashed var(--border)}
.pub-table tbody tr{cursor:pointer;transition:background-color .1s}
.pub-table tbody tr:hover{background:var(--panel-2)}
.pub-table .dirty-dot{color:var(--warn);font-size:11px}
.imp-exp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3)}
.save-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save-dot.busy i{background:var(--warn)}

/* ===== UX 重构：导航上下文 / 反馈动效 / 焦点可见 / 空态 ===== */
@keyframes panelIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel.anim{animation:panelIn .2s ease}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);margin-bottom:8px;min-height:26px;flex-wrap:wrap}
.crumb .loc{color:var(--accent);font-weight:600}
.crumb .sep{opacity:.5}
.crumb .here{color:var(--text-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.crumb .from{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
.crumb .from .mini-btn{height:24px;font-size:12px;padding:2px 9px}
.chip .c{font-size:10.5px;font-family:var(--mono);opacity:.7;margin-left:2px}
.tree-empty{padding:30px 14px;text-align:center;color:var(--text-3);font-size:13.5px;display:flex;flex-direction:column;gap:9px;align-items:center}
.tree-empty .big{font-size:26px;opacity:.4}
.show-disabled.on{color:var(--accent);font-weight:500}
button:active{transform:scale(.97)}
.fitem:active,.chip:active,.tick:active,.page-tab:active,.obj-tab:active,.tpl-var:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp:focus-visible,select.inp:focus-visible,textarea.tpl-input:focus-visible,.inline-sel:focus-visible,.inline-num:focus-visible{outline:none}
.btn.danger{border-color:var(--danger-line);color:var(--danger);background:var(--danger-soft)}
.btn.danger:hover{border-color:var(--danger)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== 新 IA：清单页（模型参数配置 / 积分配置） ===== */
body[data-nosb="1"] .actionbar{left:0}
.list-page{max-width:1400px;margin:0 auto}
.lp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.lp-head h1{font-size:21px;margin:0 0 4px;letter-spacing:-.2px}
.lp-head p{margin:0;font-size:13px;color:var(--text-3)}
.lp-head .acts{display:flex;gap:8px;align-items:center}
.lp-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.lp-stat{border:1px solid var(--border);border-radius:9px;padding:11px 13px;background:var(--panel-2)}
.lp-stat .k{font-size:12px;color:var(--text-3);margin-bottom:6px}
.lp-stat .v{font-size:21px;font-weight:600;letter-spacing:-.4px}
.lp-stat .h{font-size:11.5px;color:var(--text-3);margin-top:4px}
.lp-filters{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.lp-frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lp-frow .fl{font-size:12px;color:var(--text-3);width:38px;flex-shrink:0}
.lp-search{flex:1;min-width:220px;height:32px;border:1px solid var(--border);border-radius:6px;padding:0 11px;font:inherit;font-size:13px;background:var(--panel-2);color:var(--text)}
.lp-search:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.lp-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.lp-table th{background:var(--panel-2);font-size:12px;font-weight:500;color:var(--text-3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.lp-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.lp-table tbody tr{cursor:pointer;transition:background-color .1s}
.lp-table tbody tr:hover{background:var(--panel-2)}
.lp-table tbody tr:last-child td{border-bottom:0}
.lp-name{display:flex;flex-direction:column;gap:2px}
.lp-name b{font-weight:600}
.lp-name span{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.lp-op{color:var(--accent);font-size:12.5px;white-space:nowrap}
.lp-empty{padding:44px 16px;text-align:center;color:var(--text-3);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:center}
.lp-bar{display:inline-block;width:66px;height:8px;border-radius:4px;background:var(--panel-3);position:relative;overflow:hidden;vertical-align:-1px;margin-right:7px}
.lp-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55}

/* ===== 新 IA：功能详情页 + 悬浮切换器 ===== */
.dwrap{max-width:1400px;margin:0 auto;position:relative}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
.dtop .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dtop .right>.mini-btn{max-width:168px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.dswitch{position:relative}
.sw-pill2{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:18px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12.5px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.sw-pill2:hover{border-color:var(--accent)}

/* =========================================================================
   五、基础工具
   ========================================================================= */
const $ = id => document.getElementById(id);
const modelById = id => MODELS.find(m => m.id === id);
const featById  = id => FEATURES.find(f => f.id === id);
const tplOf     = f  => TEMPLATES[f.tpl];

function candidateModels(slot){
  return MODELS.filter(m => {
    if(!slot.families.includes(m.family)) return false;
    if(slot.requireCap && !m.caps[slot.requireCap]) return false;
    return true;
  });
}
function makeConfig(f){
  const slots = {}, params = {}, expose = {};
  tplOf(f).slots.forEach(s => { const pool = candidateModels(s); slots[s.key] = pool.length ? pool[0].id : ""; });
  tplOf(f).params.forEach(p => { params[p.key] = Array.isArray(p.def) ? p.def.slice() : p.def; });
  return {slots, params, expose, base:f.base, status:"on", fallbacks:[],
    breaker:{threshold:3, cooldown:5}, published:false, dirty:false};
}
/* 合并所有槽位模型能力供参数表取用：
   数组类能力「先到先得」，数值类能力取各槽位中更严格（更小）者 */
function mergedCaps(f){
  const cfg = STORE[f.id], out = {};
  tplOf(f).slots.forEach(s => {
    const m = modelById(cfg.slots[s.key]);
    if(!m) return;
    Object.keys(m.caps).forEach(k => {
      const v = m.caps[k];
      if(out[k] === undefined){ out[k] = v; return; }
      if(typeof out[k] === "number" && typeof v === "number") out[k] = Math.min(out[k], v);
    });
  });
  return out;
}
/* 「暴露给前端」是功能级配置，不能写回模板定义 */
function isExposed(f, p){
  const o = STORE[f.id].expose;
  return (o && o[p.key] !== undefined) ? o[p.key] : (p.expose !== false);
}
function capsOwner(f, key){
  const cfg = STORE[f.id];
  for(const s of tplOf(f).slots){
    const m = modelById(cfg.slots[s.key]);
    if(m && m.caps[key] !== undefined) return m;
  }
  return null;
}
/* 综合档位倍率 = 各槽位倍率之和 − (槽位数 − 1) */
function effectiveTier(f){
  const cfg = STORE[f.id];
  const ids = tplOf(f).slots.map(s => cfg.slots[s.key]).filter(Boolean);
  if(!ids.length) return 1;
  const sum = ids.reduce((a,id) => a + (modelById(id) ? modelById(id).tier : 1), 0);
  return +(sum - (ids.length - 1)).toFixed(2);
}
function unitCost(f){
  const cfg = STORE[f.id];
  return tplOf(f).slots.map(s => cfg.slots[s.key]).filter(Boolean)
    .reduce((a,id) => a + (modelById(id) ? modelById(id).cost : 0), 0);
}

/* =========================================================================
   六、参数解析与积分计算
   ========================================================================= */
/* 返回数组=可选列表；{max:n}=数值上限；null=当前模型不支持 */
function paramOptions(f, p){
  const caps = mergedCaps(f);
  if(p.cap){
    const v = caps[p.cap];
    if(v === undefined) return null;
    if(Array.isArray(v)) return v.slice();
    if(typeof v === "number") return {max:v};
    if(typeof v === "boolean") return v ? ["开","关"] : null;
    return null;
  }
  return (p.options || []).slice();
}
/* 布尔型能力（如 feather / audio）值为 false 时表示「该模型不具备此能力」 */
function paramSupported(f, p){
  if(!p.cap) return true;
  const v = mergedCaps(f)[p.cap];
  if(v === undefined) return false;
  if(v === false) return false;
  return true;
}
function paramVisible(f, p){
  if(p.show && !mergedCaps(f)[p.show]) return false;
  return true;
}
function paramCredit(f, p, val){
  const c = p.credit;
  if(!c) return {d:0, note:""};
  if(c.kind === "num"){
    let n = 0;
    if(p.ctrl === "multi") n = Array.isArray(val) ? val.length : 0;
    else if(p.ctrl === "switch") n = val ? 1 : 0;
    else if(p.ctrl === "upload") n = 0;
    else n = Number(val);
    if(!isFinite(n) || n < 0) n = 0;
    return {d:+ (n * c.coef).toFixed(2), note: c.coef ? n + " × " + c.coef : ""};
  }
  if(c.kind === "map"){ const d = c.map[val] === undefined ? 0 : c.map[val]; return {d, note: d ? "档位 " + val : ""}; }
  if(c.kind === "bool"){ const d = val ? c.on : 0; return {d, note: (val && c.on) ? "已开启" : ""}; }
  return {d:0, note:""};
}
function paramRange(f, p){
  const opts = paramOptions(f, p), c = p.credit;
  if(p.ctrl === "switch") return (c && c.kind === "bool") ? [0, c.on] : [0,0];
  if(p.ctrl === "upload") return [0,0];
  if(opts === null) return [0,0];
  if(p.ctrl === "multi") return (c && c.kind === "num") ? [0, opts.length * c.coef] : [0,0];
  if(!Array.isArray(opts) && opts.max !== undefined)
    return (c && c.kind === "num") ? [0, opts.max * c.coef] : [0,0];
  if(Array.isArray(opts)){
    if(c && c.kind === "num"){
      const nums = opts.filter(v => typeof v === "number");
      return nums.length ? [Math.min.apply(null,nums)*c.coef, Math.max.apply(null,nums)*c.coef] : [0,0];
    }
    if(c && c.kind === "map"){
      const vals = opts.map(o => c.map[o] === undefined ? 0 : c.map[o]).filter(v => v >= 0);
      return vals.length ? [Math.min.apply(null,vals), Math.max.apply(null,vals)] : [0,0];
    }
  }
  return [0,0];
}
const MAX_EXTRA = 5000;
function calculate(f){
  const cfg = STORE[f.id], tpl = tplOf(f);
  const steps = [{label:"功能基础分", sub:f.id + " · " + tpl.name, v:f.base}];
  let sum = f.base;
  tpl.params.forEach(p => {
    if(!paramVisible(f,p) || !paramSupported(f,p)) return;
    const {d, note} = paramCredit(f, p, cfg.params[p.key]);
    if(d === 0){ steps.push({label:p.label, sub:note || "不计价", v:0}); return; }
    sum += d;
    steps.push({label:p.label, sub:note, v:d});
  });
  const capped = sum > MAX_EXTRA;
  sum = Math.min(sum, MAX_EXTRA);
  steps.push({label:"参数小计", sub: capped ? "已触达上限 " + MAX_EXTRA + "，按上限取值" : "基础分 + 参数加价", v:sum, sum:true});
  const tier = effectiveTier(f);
  const slotTiers = tpl.slots.map(s => { const m = modelById(cfg.slots[s.key]); return m ? m.tier : 1; });
  steps.push({label:"模型档位倍率 ×" + tier,
    sub: slotTiers.join(" + ") + (tpl.slots.length > 1 ? " − " + (tpl.slots.length - 1) : ""), v:"×" + tier, mul:true});
  return {steps, subtotal:sum, tier, total: Math.max(1, Math.ceil(sum * tier))};
}
function creditRange(f){
  let lo = f.base, hi = f.base;
  tplOf(f).params.forEach(p => {
    if(!paramVisible(f,p) || !paramSupported(f,p)) return;
    const r = paramRange(f, p); lo += r[0]; hi += r[1];
  });
  const tier = effectiveTier(f);
  return [Math.max(1, Math.ceil(lo*tier)), Math.max(1, Math.ceil(hi*tier))];
}

/* 筛选 chips：带上各分组/角色的对象数量，工具页统计工具、功能页统计启用功能 */
function chipCounts(kind){
  const cnt = {};
  if(PAGE === "tools"){
    TOOLS.forEach(t => { ((TOOL_STORE[t.id] || {})[kind] || []).forEach(x => { cnt[x] = (cnt[x]||0)+1; }); });
  } else {
    FEATURES.filter(f => !f.disabled).forEach(f => { (f[kind] || []).forEach(x => { cnt[x] = (cnt[x]||0)+1; }); });
  }
  return cnt;
}
function renderGroupChips(){
  const el = $("groupChips");
  const pool = PAGE === "tools" ? TOOLS : FEATURES.filter(f => !f.disabled);
  const cnt = chipCounts("groups");
  el.innerHTML = '<span class="chip' + (filters.group===""?" on":"") + '" data-g="">全部<i class="c">' + pool.length + '</i></span>' +
    GROUPS.filter(g=>g!=="未分组").map(g => '<span class="chip' + (filters.group===g?" on":"") + '" data-g="' + g + '">' + g + '<i class="c">' + (cnt[g]||0) + '</i></span>').join("");
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => { filters.group = c.dataset.g; renderGroupChips(); refresh(); });
}
function renderRoleChips(){
  const el = $("roleChips");
  const pool = PAGE === "tools" ? TOOLS : FEATURES.filter(f => !f.disabled);
  const cnt = chipCounts("roles");
  el.innerHTML = '<span class="chip role' + (filters.role===""?" on":"") + '" data-r="">全部<i class="c">' + pool.length + '</i></span>' +
    ROLES.map(r => '<span class="chip role' + (filters.role===r?" on":"") + '" data-r="' + r + '">' + r + '<i class="c">' + (cnt[r]||0) + '</i></span>').join("");
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => { filters.role = c.dataset.r; renderRoleChips(); refresh(); });
}
function matchFilter(f){
  if(f.disabled && !showDisabled) return false;
  if(filters.group && f.groups.indexOf(filters.group) < 0) return false;
  if(filters.role && f.roles.indexOf(filters.role) < 0) return false;
  if(filters.q){
    const cfg = STORE[f.id];
    const names = tplOf(f).slots.map(s => { const m = modelById(cfg.slots[s.key]); return m ? m.name : ""; }).join(" ");
    const hay = (f.name + " " + f.jump + " " + f.groups.join(" ") + " " + names + " " + tplOf(f).name).toLowerCase();
    if(hay.indexOf(filters.q.toLowerCase()) < 0) return false;
  }
  return true;
}
function renderTree(){
  const hit = FEATURES.filter(matchFilter);
  let html = "";
  GROUPS.forEach(g => {
    const list = hit.filter(f => f.groups.indexOf(g) >= 0);
    if(!list.length) return;
    const collapsed = (filters.q || filters.group) ? "" :
      (g === "未分组" || g === "出海贸易" || g === "商机选品" ? " collapsed" : "");
    html += '<div class="grp' + collapsed + '"><div class="grp-head"><span class="arw">▼</span><span>' + g +
      '</span><span class="grp-count">' + list.length + '</span></div><div class="grp-body">';
    list.forEach(f => {
      const cfg = STORE[f.id];
      if(f.disabled){
        html += '<div class="fitem disabled' + (activeId===f.id?" on":"") + '" data-fid="' + f.id + '">' +
          '<span class="dot" style="background:var(--text-3)"></span><span class="fitem-name">' + f.name + '</span>' +
          '<span class="fitem-meta">已停用</span>' +
          (PAGE === "catalog" ? '<span class="quick"><button onclick="event.stopPropagation();restoreFeature(\'' + f.id + '\')">恢复</button></span>' : '') +
          '</div>';
        return;
      }
      const r = creditRange(f);
      const noModel = tplOf(f).slots.some(s => !cfg.slots[s.key]);
      const losing = calculate(f).total * POINT_TO_YUAN - unitCost(f) < 0;
      const dot = losing ? "bad" : ((f.roles.length === 0 || noModel) ? "warn" : "ok");
      const tip = losing ? ' title="按当前汇率该配置单次亏损"' : '';
      const quick = PAGE === "catalog"
        ? '<span class="quick"><button title="复制功能" onclick="event.stopPropagation();dupFeature(\'' + f.id + '\')">复制</button>' +
          '<button title="停用（可恢复）" onclick="event.stopPropagation();disableFeature(\'' + f.id + '\')">停用</button></span>'
        : '';
      html += '<div class="fitem' + (activeId===f.id?" on":"") + '" data-fid="' + f.id + '"' + tip + '>' +
        '<span class="dot ' + dot + '"></span><span class="fitem-name">' + f.name + '</span>' +
        '<span class="fitem-meta">' + r[0] + '–' + r[1] + '</span>' + quick + '</div>';
    });
    html += '</div></div>';
  });
  if(!html) html = '<div class="tree-empty"><div class="big">⌕</div><div>没有匹配的功能</div>' +
    '<div class="hint">换个关键词，或清除筛选条件再试</div>' +
    '<button class="mini-btn" onclick="clearFilters()">清除搜索与筛选</button></div>';
  const tree = $("tree");
  tree.innerHTML = html;
  tree.querySelectorAll(".grp-head").forEach(h => h.onclick = () => h.parentElement.classList.toggle("collapsed"));
  tree.querySelectorAll(".fitem").forEach(it => it.onclick = () => selectFeature(it.dataset.fid));
}
function lossCount(){
  return FEATURES.filter(f => !f.disabled &&
    calculate(f).total * POINT_TO_YUAN - unitCost(f) < 0).length;
}
function renderSbFoot(){
  if(PAGE === "tools"){ renderToolSbFoot(); return; }
  if(PAGE === "publish"){ $("sbFoot").innerHTML = ""; return; }
  const feats = FEATURES.filter(f => !f.disabled);
  const total = feats.length;
  const ready = feats.filter(f => STORE[f.id].published).length;
  const noRole = feats.filter(f => f.roles.length === 0).length;
  const noModel = feats.filter(f => tplOf(f).slots.some(s => !STORE[f.id].slots[s.key])).length;
  const avg = total ? Math.round(feats.reduce((a,f) => a + creditRange(f)[0], 0) / total) : 0;
  const loss = lossCount();
  const off = FEATURES.length - feats.length;
  $("sbFoot").innerHTML =
    '<div class="stat-row"><span>已发布配置</span><b>' + ready + ' / ' + total + '</b></div>' +
    '<div class="bar"><i style="width:' + (total ? Math.round(ready/total*100) : 0) + '%"></i></div>' +
    '<div class="stat-row"><span>未分配角色 / 未选模型</span><b>' + noRole + ' / ' + noModel + '</b></div>' +
    '<div class="stat-row"><span>基础积分均价</span><b>' + avg + ' 分</b></div>' +
    '<div class="stat-row"><span>按当前汇率会亏损的功能</span><b style="color:' + (loss ? 'var(--danger)' : 'var(--ok)') + '">' + loss + ' 项</b></div>' +
    (off ? '<div class="stat-row"><span>已停用（默认隐藏）</span><b>' + off + ' 项</b></div>' : '');
}

  const filled = tpl.params.filter(p => {
    const v = cfg.params[p.key];
    return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== null && v !== "");
  }).length;
  return {filled, total: tpl.params.length};
}
function confState(f){
  const cfg = STORE[f.id], sf = slotFill(f);
  if(cfg.published) return {t:"已发布", cls:"green"};
  if(sf.filled < sf.total) return {t:"未配置", cls:"amber"};
  return {t:"待发布", cls:"gray"};
}
function listPageHTML(kind){
  const isModel = kind === "model";

  const rows = feats.length;
  let stats = "";
  if(isModel){
    let pub = 0, gap = 0; const models = new Set();
    feats.forEach(f => {
      const sf = slotFill(f);
      if(STORE[f.id].published) pub++;
      gap += Math.max(0, sf.total - sf.filled);
      const m = mainSlotModel(f); if(m) models.add(m.id);
    });
    stats = '<div class="lp-stat"><div class="k">已发布</div><div class="v">' + pub + '</div><div class="h">占 ' + (rows ? Math.round(pub / rows * 100) : 0) + '%</div></div>' +
      '<div class="lp-stat"><div class="k">待发布</div><div class="v">' + (rows - pub) + '</div><div class="h">配置完成但未上线</div></div>' +
      '<div class="lp-stat"><div class="k">空槽位</div><div class="v">' + gap + '</div><div class="h">需补齐才能发布</div></div>' +
      '<div class="lp-stat"><div class="k">在用模型</div><div class="v">' + models.size + '</div><div class="h">按主模型去重</div></div>';
  } else {
    let loss = 0, margins = [];
    feats.forEach(f => {
      const calc = calculate(f), cost = unitCost(f), rev = calc.total * POINT_TO_YUAN;
      const m = rev - cost; if(m < 0) loss++;
      margins.push(rev > 0 ? m / rev : 0);
    });
    margins.sort((a,b) => a-b);
    const med = margins.length ? margins[Math.floor(margins.length/2)] : 0;
    const avgBase = rows ? Math.round(feats.reduce((s,f)=>s+f.base,0) / rows) : 0;
    stats = '<div class="lp-stat"><div class="k">基础分均价</div><div class="v">' + avgBase + '</div><div class="h">分 / 次</div></div>' +
      '<div class="lp-stat"><div class="k">亏损功能</div><div class="v">' + loss + '</div><div class="h">按汇率 ¥' + POINT_TO_YUAN.toFixed(3) + '</div></div>' +
      '<div class="lp-stat"><div class="k">毛利率中位</div><div class="v">' + (med*100).toFixed(0) + '%</div><div class="h">扣模型成本后</div></div>' +
      '<div class="lp-stat"><div class="k">积分汇率</div><div class="v">¥' + POINT_TO_YUAN.toFixed(3) + '</div><div class="h">在下方明细中核对</div></div>';
  }
  return '<div class="list-page">' +
    '<div class="lp-head"><div><h1>' + (isModel ? "模型参数配置" : "积分配置") + '</h1><p>' +
      (isModel ? "按功能查看主模型与槽位状态；点击行进入该功能的专项配置"
               : "按功能核对基础分、积分区间与毛利；点击行进入积分规则") +
    '</p></div><div class="acts">' +
      '<span class="hint" style="font-size:12px;color:var(--text-3)">配置动作在功能详情页完成</span>' +
    '</div></div>' +
    '<div class="lp-stats">' + stats + '</div>' +
    '<div class="lp-filters">' +
      '<div class="lp-frow"><input class="lp-search" id="lpQ" value="' + tEsc(filters.q) + '" placeholder="搜索功能名 / ID / 分组…" oninput="onListQ(this.value)">' +
        '<span class="hint" id="lpCount" style="font-size:12px;color:var(--text-3);white-space:nowrap">显示 ' + rows + ' 条</span></div>' +
      '<div class="lp-frow" id="lpChips"><span class="fl">分组</span>' + listChipsHTML("group") + '</div>' +
      '<div class="lp-frow"><span class="fl">角色</span>' + listChipsHTML("role") + '</div>' +
    '</div>' +
    '<div id="listBody">' + listBodyHTML(kind) + '</div>' +
  '</div>';
}
function listChipsHTML(kind){

/* 布局外壳：只有「助手工具」还保留左树；目录 / 清单 / 详情 / 发布都是全宽 */

}
function openDetail(fid, tab){
  DETAIL = {fid, tab: tab || "model", from: PAGE, filters: {q:filters.q, group:filters.group, role:filters.role}, scroll: $("panel").scrollTop};
  activeId = fid;
  RECENT = [fid].concat(RECENT.filter(x => x !== fid)).slice(0, 3);

  $("panel").scrollTop = 0;
}
function closeDetail(){
  if(!DETAIL) return;

function backToGroup(g){

function detailNav(dir){

function onSwitchQ(v){ SW_Q = v; SW_IDX = 0; const list = $("swList"); if(list) list.innerHTML = switchListHTML(); }
/* ↑ ↓ 在浮层内移动，Enter 打开；保持键盘可用性，与底部提示一致 */

function switchItemHTML(x){

document.addEventListener("click", e => {
  if(!SW_OPEN) return;
  const sw = $("dswitch");
  if(sw && !sw.contains(e.target)){ SW_OPEN = false; const p = $("swPop"); if(p) p.classList.remove("on"); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && SW_OPEN){ SW_OPEN = false; const p = $("swPop"); if(p) p.classList.remove("on"); return; }
  if(SW_OPEN && (e.key === "ArrowDown" || e.key === "ArrowUp")){ e.preventDefault(); swMove(e.key === "ArrowDown" ? 1 : -1); return; }
  if(SW_OPEN && e.key === "Enter"){ e.preventDefault(); swPick(); return; }
  if(!DETAIL || e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

/* =========================================================================
   十一·六、功能目录页（列表 + 批量 + 增删改查；模型/积分只读引用）
   ========================================================================= */
const CAT = {q:"", group:"", role:"", status:"", stopped:true, sel:new Set(), col:new Set()};
function catPrimary(f){ return (f.groups && f.groups[0]) || "未分组"; }
function catConf(f){
  const t = confState(f).t;
  return t === "已发布" ? "published" : t === "未配置" ? "none" : "pending";
}
function catMatch(f){
  if(f.disabled && !CAT.stopped) return false;
  if(CAT.group && f.groups.indexOf(CAT.group) < 0) return false;
  if(CAT.role && f.roles.indexOf(CAT.role) < 0) return false;
  if(CAT.status && catConf(f) !== CAT.status) return false;
  if(CAT.q){
    const hay = (f.name + " " + f.id + " " + (f.jump || "") + " " + f.groups.join(" ") + " " + f.roles.join(" ") + " " + tplOf(f).name).toLowerCase();
    if(hay.indexOf(CAT.q.toLowerCase()) < 0) return false;
  }
  return true;
}
function catList(){ return FEATURES.filter(catMatch); }
function catStatsHTML(){
  const total = FEATURES.length;
  const online = FEATURES.filter(f => !f.disabled && STORE[f.id].published).length;
  const pending = FEATURES.filter(f => catConf(f) === "none").length;
  const stopped = FEATURES.filter(f => f.disabled).length;
  return '<div class="lp-stats">' +
    '<div class="lp-stat"><div class="k">功能总数</div><div class="v">' + total + '</div><div class="h">含已停用 ' + stopped + ' 个</div></div>' +
    '<div class="lp-stat"><div class="k">已上线</div><div class="v">' + online + '</div><div class="h">发布后前台可用</div></div>' +

function catGroupRow(g, n, noCheck, selN, collapsed){

function catBodyHTML(){
  const list = catList();
  if(!list.length){
    return '<tr><td colspan="9"><div class="cat-empty"><div class="big">⌕</div><div>没有匹配的功能</div>' +
      '<div style="font-size:12px;margin-top:4px">换个关键词，或清除筛选条件再试</div>' +
      '<button class="mini-btn" style="margin-top:10px" onclick="catResetFilters()">清除筛选</button></div></td></tr>';
  }
  const block = (g, rows, noCheck) => {
    const collapsed = CAT.col.has(g);
    const selN = rows.filter(f => CAT.sel.has(f.id)).length;
    return catGroupRow(g, rows.length, noCheck, selN, collapsed) +
      (collapsed ? "" : rows.map(catRowHTML).join(""));
  };
  let html = "";
  if(CAT.group){
    html = block(CAT.group, list, true);
  } else {
    const used = new Set();
    GROUPS.forEach(g => {
      const rows = list.filter(f => catPrimary(f) === g);
      if(!rows.length) return;
      used.add(g);
      html += block(g, rows, false);
    });
    const rest = list.filter(f => !used.has(catPrimary(f)));
    if(rest.length) html += block("其他", rest, true);
  }
  return html;
}

function renderCatalog(){
  const panel = $("panel"); if(!panel) return;
  [...CAT.sel].forEach(id => { if(!featById(id)) CAT.sel.delete(id); });
  panel.innerHTML = catalogPageHTML();
  bindCatalog();
  catSyncSel();
}
function bindCatalog(){
  const body = $("catBody");
  if(body){
    body.onclick = e => {
      const op = e.target.closest ? e.target.closest(".op") : null;
      if(op){
        const id = op.dataset.fid;
        if(op.dataset.act === "config") openDetail(id, "model");
        else if(op.dataset.act === "edit") openFeatureForm(id);
        else if(op.dataset.act === "toggle") catToggleStop(id);
        return;
      }
      if(e.target.closest("input")) return;
      const gr = e.target.closest(".cat-grow");
      if(gr){ catToggleGroup(gr.dataset.g); return; }
      const tr = e.target.closest(".cat-row");
      if(tr) openDetail(tr.dataset.fid, "model");
    };
    body.onchange = e => {
      const c = e.target;
      if(c.classList.contains("row-chk")){
        c.checked ? CAT.sel.add(c.dataset.fid) : CAT.sel.delete(c.dataset.fid);
        catSyncSel();
      } else if(c.classList.contains("grp-chk")){
        const rows = CAT.group ? catList() : catList().filter(f => catPrimary(f) === c.dataset.g);
        rows.forEach(f => c.checked ? CAT.sel.add(f.id) : CAT.sel.delete(f.id));
        catSyncSel();
      }
    };
  }
  const chips = $("catChips");
  if(chips) chips.onclick = e => {
    const c = e.target.closest ? e.target.closest(".chip") : null;
    if(!c) return;
    CAT[c.dataset.k] = c.dataset.v || "";
    CAT.col.clear();          /* 换筛选就全展开，避免结果被折叠藏起来 */
    renderCatChips(); renderCatBody();
  };
}
/* 一级分组折叠：筛选变化时自动全展开；「全部收起 / 展开」一次处理所有分组 */
function catToggleGroup(g){
  if(!g) return;
  CAT.col.has(g) ? CAT.col.delete(g) : CAT.col.add(g);
  renderCatBody();
}
function catToggleAll(){
  const groups = [...document.querySelectorAll("#catBody .cat-grow")].map(r => r.dataset.g);
  if(!groups.length) return;
  const allCollapsed = groups.every(g => CAT.col.has(g));
  if(allCollapsed) CAT.col.clear(); else groups.forEach(g => CAT.col.add(g));
  renderCatBody();
}
function syncCatToggle(){
  const el = $("catGToggle"); if(!el) return;
  const groups = [...document.querySelectorAll("#catBody .cat-grow")].map(r => r.dataset.g);
  const allCollapsed = groups.length > 0 && groups.every(g => CAT.col.has(g));
  el.textContent = allCollapsed ? "▸ 全部展开" : "▾ 全部收起";
}
function catSyncSel(){
  const vis = catList();
  const n = CAT.sel.size;
  const selVis = vis.filter(f => CAT.sel.has(f.id)).length;
  const bar = $("catBatch");
  if(bar) bar.classList.toggle("on", n > 0);
  if($("catBatchN")) $("catBatchN").textContent = n;
  if($("catSelN")) $("catSelN").textContent = "已选 " + n + " 项 · 当前筛选 " + vis.length + " 项";
  const all = $("catSelAll");
  if(all){ all.checked = vis.length > 0 && selVis === vis.length; all.indeterminate = selVis > 0 && selVis < vis.length; }
  document.querySelectorAll("#catBody .cat-row").forEach(r => {
    const on = CAT.sel.has(r.dataset.fid);
    r.classList.toggle("sel", on);
    const c = r.querySelector(".row-chk"); if(c) c.checked = on;
  });
  document.querySelectorAll("#catBody .grp-chk").forEach(c => {
    const rows = CAT.group ? catList() : catList().filter(f => catPrimary(f) === c.dataset.g);
    const s = rows.filter(f => CAT.sel.has(f.id)).length;
    c.checked = rows.length > 0 && s === rows.length;
    c.indeterminate = s > 0 && s < rows.length;
  });
}
function renderCatChips(){ const el = $("catChips"); if(el) el.innerHTML = catChipsHTML(); }
function renderCatBody(){
  const el = $("catBody"); if(el) el.innerHTML = catBodyHTML();

function catToggleStop(id){

function catOpenBatch(kind){
  if(!CAT.sel.size){ toast("请先勾选功能"); return; }

  const body = '<div class="hint" style="margin-bottom:10px">已选 <b>' + CAT.sel.size + '</b> 项，应用后这些项的' +

    '<div class="check-list" id="cbTicks">' +

  modal(kind === "group" ? "批量修改归属分组" : "批量修改开放角色", body, "应用", () => catApplyBatch(kind));

function catApplyBatch(kind){
  const chosen = Array.prototype.map.call(document.querySelectorAll("#cbTicks .tick.on"), t => t.dataset.v);
  if(kind === "group" && !chosen.length){ toast("请至少选择一个分组"); return; }

function slotHTML(f, s, i){

      '<option value="' + m.id + '"' + (cfg.slots[s.key]===m.id?" selected":"") + '>' +
      m.name + ' · ' + m.vendor + ' · ×' + m.tier.toFixed(2) + '</option>').join("") + '</optgroup>';
  });
  const tags = cur ? [
    '<span class="tag ' + (FAMILY_TAG[cur.family]||"gray") + '">' + FAMILY_LABEL[cur.family] + '</span>',
    '<span class="tag">档位 ×' + cur.tier.toFixed(2) + '</span>',
    '<span class="tag">单次成本 ¥' + cur.cost.toFixed(3) + '</span>'
  ].concat(Object.keys(cur.caps).slice(0,5).map(k => {

function rowHTML(f, p){
  const cfg = STORE[f.id];
  const opts = paramOptions(f, p);
  const supported = paramSupported(f, p);
  const val = cfg.params[p.key];
  const owner = p.cap ? capsOwner(f, p.cap) : null;
  const exposure = isExposed(f, p);

  /* 头部 chips：控件类型 + 能力来源 + 能力值 */
  let headTags = '<span class="tag k">' + ctrlLabel(p.ctrl) + '</span>';
  if(owner && supported) headTags += '<span class="tag">能力来源 ' + owner.name + '</span>';
  if(supported && p.cap){
    const cv = mergedCaps(f)[p.cap];
    if(Array.isArray(cv)) headTags += '<span class="tag">' + p.cap + ' · ' + cv.length + ' 档</span>';
    else if(typeof cv === "number") headTags += '<span class="tag">' + p.cap + ' ≤ ' + cv + '</span>';
    else if(cv === true) headTags += '<span class="tag ok">' + p.cap + ' · 支持</span>';
  }

  /* 主体：根据 supported 走不同分支 */
  let body = "";
  let foot = "";

  if(!supported){
    /* 模型不支持 → 不渲染当前值控件与可选项，只给一行说明 + 积分=0 */
    body = '<div class="muted" style="padding:6px 0 2px">当前所选模型无 <code style="font-family:var(--mono);font-size:12.5px;background:var(--panel-3);padding:1px 5px;border-radius:3px">' +
      (p.cap || "此能力") + '</code> 能力，参数不展示给前端用户</div>';
    foot = '<span class="lbl">积分影响</span><span class="v zero">不计附加</span>';
  } else {
    /* 当前值控件 */
    let ctrl = "";
    if(p.ctrl === "switch"){
      ctrl = '<span class="switch' + (val?" on":"") + '" onclick="setParam(\'' + p.key + '\',' + (!val) + ')">' +
        '<span class="track"></span>' +
        '<span style="font-size:13px;color:var(--text-2)">' + (val?"已开启":"已关闭") + '</span></span>';
    } else if(p.ctrl === "number"){
      const max = (opts && opts.max !== undefined) ? opts.max : 9999;
      ctrl = '<input class="inline-num" type="number" min="' + (p.min||0) + '" max="' + max + '" value="' + val +
        '" oninput="setParam(\'' + p.key + '\',this.value)">' +
        '<span class="muted">上限 ' + (opts && opts.max !== undefined ? opts.max : "—") + '</span>';
    } else if(p.ctrl === "multi"){
      const cur = val || [];
      ctrl = '<div style="display:flex;flex-direction:column;gap:6px"><span class="muted">已选 <b style="color:var(--text-2);font-family:var(--mono)">' + cur.length + '</b> 项</span>' +
        (cur.length ? '<div class="opt-wrap" style="max-width:none">' + cur.map(o => '<span class="ops now">' + o + '</span>').join("") + '</div>' : '') +
        '</div>';
    } else if(p.ctrl === "upload"){
      ctrl = '<span class="muted">' + (p.required?"必传图片 · 前端用户上传":"可选图片 · 前端用户上传") + '</span>';
    } else {
      ctrl = '<select class="inline-sel" onchange="setParam(\'' + p.key + '\',this.value)">' + (opts||[]).map(o =>
        '<option value="' + o + '"' + (String(val)===String(o)?" selected":"") + '>' + o + '</option>').join("") + '</select>';
    }

    /* 可选项 pills */
    let optCell = "";
    let optNote = "";
    if(p.ctrl === "switch"){
      optCell = '<div class="opt-wrap"><span class="ops' + (val?" now":"") + '">开</span>' +
        '<span class="ops' + (!val?" now":"") + '">关</span></div>' +
        '<div class="muted">开关型参数：是否开启会改变积分，前端给用户一个开关</div>';
    } else if(p.ctrl === "upload"){
      optCell = '<div class="opt-wrap"><span class="ops now">图片上传控件</span></div>' +
        '<div class="muted">该项不由运营选档，前端调用时由用户上传图片</div>';
    } else if(p.ctrl === "number"){
      optCell = '<div class="opt-wrap"><span class="ops now">0 – ' + (opts.max !== undefined ? opts.max : "—") + '</span></div>';
      if(owner) optNote = '<div class="muted" style="margin-top:5px">上限由 <b style="color:var(--text-2)">' + owner.name + '</b> 的能力决定</div>';
    } else {
      const arr = opts || [];
      const clickable = (p.ctrl === "multi" || p.ctrl === "select");
      const scroll = arr.length > 18 ? ' style="max-height:108px;overflow:auto"' : '';
      optCell = '<div class="opt-wrap"' + scroll + '>' + arr.map(o => {
        const isNew = lastDiffParams[p.key] && lastDiffParams[p.key].added.indexOf(o) >= 0;
        const isNow = p.ctrl === "multi" ? (val||[]).indexOf(o) >= 0 : String(val) === String(o);
        const clk = clickable
          ? ' style="cursor:pointer" title="点击设为默认值" onclick="' +
            (p.ctrl === "multi" ? 'toggleMulti' : 'setParam') + '(\'' + p.key + '\',\'' + o + '\')"'
          : '';
        return '<span class="ops' + (isNew ? " new" : (isNow ? " now" : "")) + '"' + clk + '>' + o + (isNew ? " ✚" : "") + '</span>';
      }).join("") + '</div>';
      if(p.ctrl === "multi"){
        let note = '<div class="muted" style="margin-top:5px">点击可切换默认选中的' + (p.key === "targetLang" ? "目标语言" : "项") + '；前台用户可继续增删</div>';
        if(p.maxCap){
          const cv = mergedCaps(f)[p.maxCap];
          note += '<div class="muted" style="margin-top:3px">上限 <b style="color:var(--text-2);font-family:var(--mono)">' + (cv === undefined ? "—" : cv) + '</b> 种（由识别 / 翻译模型决定）</div>';
        }
        optNote = note;
      } else if(owner){
        optNote = '<div class="muted" style="margin-top:5px">能力来源：<b style="color:var(--text-2)">' + owner.name + '</b></div>';
      }
    }

    /* 积分影响 */
    let creditV = 0, creditTxt = "不计价";
    const c = p.credit;
    if(c){
      if(c.kind === "num" && c.coef){
        let n = 0;
        if(p.ctrl === "multi") n = Array.isArray(val) ? val.length : 0;
        else if(p.ctrl === "switch") n = val ? 1 : 0;
        else if(p.ctrl === "upload") n = 0;
        else n = Number(val) || 0;
        creditV = n * c.coef;
        creditTxt = creditV > 0
          ? '当前值 × ' + c.coef + ' = +' + creditV + ' 分'
          : '当前值不附加分';
      } else if(c.kind === "map"){
        const d = c.map[val] || 0;
        creditV = d;
        const avail = Array.isArray(opts) ? opts : [];
        const otherKeys = Object.keys(c.map).filter(k => avail.indexOf(k) >= 0 && String(k) !== String(val));
        creditTxt = d > 0
          ? '当前 ' + val + ' 价 +' + d + ' · 其他档 ' + otherKeys.map(k => k + '+' + c.map[k]).join(' / ')
          : '当前档位 ' + val + ' 不附加';
      } else if(c.kind === "bool" && c.on){
        creditV = val ? c.on : 0;
        creditTxt = val ? '开启 +' + c.on + ' 分' : '关闭不计分';
      }
    }

    body = '<div class="param-body">' +
      '<div class="param-current"><label>前端默认值</label><div class="ctrl-wrap">' + ctrl + '</div></div>' +
      '<div class="param-options"><label>该模型下的可选项</label>' + optCell + optNote + '</div>' +
    '</div>';
    foot = '<span class="lbl">积分影响</span>' +
      '<span class="v' + (creditV === 0 ? ' zero' : '') + '">' + (creditV > 0 ? '+' + creditV + ' 分' : '不计附加') + '</span>' +
      '<span class="meta">' + creditTxt + '</span>';
  }

  /* 整张参数卡片 */
  return '<div class="param-card' + (supported?'':' unsupported') + '">' +
    '<div class="param-head">' +
      '<span class="param-label">' + p.label + (p.required ? ' <span class="req">必填</span>' : '') +
        '<span class="key">' + p.key + (p.cap ? ' · cap:' + p.cap : '') + '</span></span>' +
      '<div class="param-tags">' + headTags + '</div>' +
      '<button class="eye' + (exposure?' on':'') + '" title="' + (exposure?'已暴露给前台 · 用户可调':'后台默认 · 前台不可见') +
      '" onclick="toggleExpose(\'' + p.key + '\')">' + (exposure?'◉':'◌') + '</button>' +
    '</div>' +
    body + '<div class="param-foot">' + foot + '</div>' +
  '</div>';
}
function ctrlLabel(c){
  const m = {select:"单选",multi:"多选",switch:"开关",number:"数字",upload:"上传",readonly:"只读"};
  return m[c] || c;
}
function frontPreviewHTML(f){
  const tpl = tplOf(f);
  const exposed = tpl.params.filter(p => isExposed(f,p) && paramSupported(f,p) && paramVisible(f,p));
  if(!exposed.length)
    return '<div class="front-preview"><div class="t">前端将展示 0 个参数</div>' +
      '<div class="muted">当前配置下前台不暴露任何参数，用户只能直接提交。</div></div>';
  return '<div class="front-preview"><div class="t">◉ 前端将展示 ' + exposed.length + ' 个参数（' +
    (tpl.params.length - exposed.length) + ' 个不暴露给用户）</div><div class="ctrl-mock">' +
    exposed.map(p => {
      const v = STORE[f.id].params[p.key];
      let disp;
      if(p.ctrl === "multi") disp = (v||[]).join(" / ") || "未选";
      else if(p.ctrl === "switch") disp = v ? "开" : "关";
      else if(p.ctrl === "upload") disp = "上传图片";
      else disp = String(v);
      return '<div class="mock-field"><span>' + p.label + '</span><div class="box">' + disp + '</div></div>';
    }).join("") + '</div></div>';
}

/* -------- 基础工具 -------- */
function toolById(id){ return TOOLS.find(t => t.id === id); }
function toolCfg(){ return TOOL_STORE[activeToolId]; }
function tEsc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function makeToolConfig(t){
  return {
    name: t.name,
    recommend: t.recommend,
    rank: t.rank,
    status: t.status,
    roles: t.roles.slice(),
    groups: t.groups.slice(),
    llm: t.purpose.llm,
    user: t.purpose.user,
    entry: {page:t.entry.page, button:t.entry.button, slot:t.entry.slot},
    intent: {desc:t.intent.desc, followUp:t.intent.followUp},
    inputs: t.inputs.map(x => ({key:x.key, def:Array.isArray(x.def) ? x.def.slice() : x.def, exposed:x.exposed})),
    texts: {
      missing:     t.texts.missing.map(r => ({c:r.c, t:r.t})),
      progress:    t.texts.progress.map(r => ({c:r.c, t:r.t})),
      errors:      t.texts.errors.map(r => ({c:r.c, t:r.t})),
      inputErrors: t.texts.inputErrors.map(r => ({c:r.c, t:r.t}))
    },
    version: t.prompt.version,
    remote: t.prompt.remote,
    promptStatus: t.prompt.status,
    snaps: t.prompt.snaps.map(x => ({v:x.v, ts:x.ts, by:x.by, cur:x.cur})),
    published: false,
    dirty: false
  };
}
function inputMeta(t, key){ return t.inputs.find(x => x.key === key); }
function inputCfg(key){ return toolCfg().inputs.find(x => x.key === key); }
function textGroupsOf(t, key){ return t.texts[key]; }
function rowsOf(key){ return toolCfg().texts[key]; }
function chanOn(t, c){ return t.channels.indexOf(c) >= 0; }
function toolBadges(t){ return t.channels.slice(); }
function toolFileName(t){
  const r = TOOL_STORE[t.id];
  return r && r.name ? r.name : t.name;
}
/* -------- 对象切换 -------- */
function matchToolFilter(t){
  const q = (filters.q || "").trim().toLowerCase();
  if(!q) return true;
  const r = TOOL_STORE[t.id] || {};
  return (toolFileName(t) + " " + t.regName + " " + t.channels.join(" ") + " " +
          t.groups.join(" ") + " " + (r.llm || "") + " " + (r.user || "")).toLowerCase().indexOf(q) >= 0;
}
/* 版本指针是否落后于远端：状态字段或「远端版本 ≠ 当前生效版本」任一成立即视为 stale。
   修复：手动回退版本下拉后 promptStatus 未联动，导致 UI 矛盾徽标且发布守卫失效 */
function toolStale(id){
  const r = TOOL_STORE[id];
  if(!r) return false;
  if(r.promptStatus === "none") return false;
  return r.promptStatus === "stale" || r.remote !== r.version;
}
function toolStatus(t){
  const r = TOOL_STORE[t.id];
  if(r.roles.length === 0) return {dot:"warn", tip:' title="未分配开放角色，前台不可见"'};
  if(toolStale(t.id)) return {dot:"warn", tip:' title="提示词版本落后于远端，需同步"'};
  if(r.recommend && !r.rank) return {dot:"warn", tip:' title="已设为前台推荐，但未设置推荐位序"'};
  return {dot:"ok", tip:""};
}

/* -------- 九·一 工具树 -------- */
function renderToolTree(){
  const hit = TOOLS.filter(matchToolFilter)
    .filter(t => !filters.group || TOOL_STORE[t.id].groups.indexOf(filters.group) >= 0)
    .filter(t => !filters.role  || TOOL_STORE[t.id].roles.indexOf(filters.role)  >= 0);
  const allGroups = ["AI图片创作","AI视频创作","图片处理","多语言翻译","店铺经营","商机选品","出海贸易","未分组"];
  let html = "";
  allGroups.forEach(g => {
    if(filters.group && g !== filters.group) return;
    const list = hit.filter(t => TOOL_STORE[t.id].groups.indexOf(g) >= 0);
    if(!list.length) return;
    const collapsed = filters.q ? "" : (g === "未分组" ? " collapsed" : "");
    html += '<div class="grp' + collapsed + '"><div class="grp-head"><span class="arw">▼</span><span>' + g +
      '</span><span class="grp-count">' + list.length + '</span></div><div class="grp-body">';
    list.forEach(t => {
      const st = toolStatus(t);
      const ch = t.channels.map(c => c === "推荐按钮" ? "推荐" : "意图").join("/");
      html += '<div class="fitem' + (activeToolId === t.id ? " on" : "") + '" data-tid="' + t.id + '"' + st.tip + '>' +
        '<span class="dot ' + st.dot + '"></span>' +
        '<span class="fitem-name">' + tEsc(toolFileName(t)) + '</span>' +
        '<span class="fitem-meta">' + ch + '</span></div>';
    });
    html += '</div></div>';
  });
  if(!html) html = '<div class="tree-empty"><div class="big">⌕</div><div>没有匹配的工具</div>' +
    '<div class="hint">换个关键词，或清除筛选条件再试</div>' +
    '<button class="mini-btn" onclick="clearFilters()">清除搜索与筛选</button></div>';
  const tree = $("tree");
  tree.innerHTML = html;
  tree.querySelectorAll(".grp-head").forEach(h => h.onclick = () => h.parentElement.classList.toggle("collapsed"));
  tree.querySelectorAll(".fitem").forEach(it => it.onclick = () => selectTool(it.dataset.tid));
}
function toolLossCount(){
  return TOOLS.filter(t => toolStale(t.id)).length;
}
function renderToolSbFoot(){
  const total = TOOLS.length;
  const ready = TOOLS.filter(t => TOOL_STORE[t.id].published).length;
  const noRole = TOOLS.filter(t => TOOL_STORE[t.id].roles.length === 0).length;
  const rec = TOOLS.filter(t => TOOL_STORE[t.id].recommend).length;
  const dual = TOOLS.filter(t => t.channels.length === 2).length;
  const stale = toolLossCount();
  $("sbFoot").innerHTML =
    '<div class="stat-row"><span>已发布配置</span><b>' + ready + ' / ' + total + '</b></div>' +
    '<div class="bar"><i style="width:' + Math.round(ready / total * 100) + '%"></i></div>' +
    '<div class="stat-row"><span>前台推荐 / 双通路</span><b>' + rec + ' / ' + dual + '</b></div>' +
    '<div class="stat-row"><span>未分配角色</span><b>' + noRole + ' 项</b></div>' +
    '<div class="stat-row"><span>提示词待同步</span><b style="color:' + (stale ? 'var(--warn)' : 'var(--ok)') + '">' + stale + ' 项</b></div>';
}

function selectTool(id){
  activeToolId = id;
  renderToolTree(); renderToolPanel(); updateToolActionStatus();
  flashPanel();
}
function roMono(v){
  return '<div class="ro-mono"><span>' + tEsc(v) + '</span><span class="cp" title="复制">⧉</span></div>';
}
function varsOf(rows){
  const set = [];
  rows.forEach(r => {
    const m = String(r.t || "").match(/\{([^}]+)\}/g) || [];
    m.forEach(x => { const k = x.slice(1, -1); if(set.indexOf(k) < 0) set.push(k); });
  });
  return set;
}
function hlVars(str){
  return tEsc(str).replace(/\{([^}]+)\}/g, '<span class="tpl-var">{$1}</span>');
}
