      '<div class="fork-note" style="margin-top:10px"><span>ⓘ</span><span>这一栏记录的是<b>通路来源</b>，不是一条可编辑的规则。它由研发注册工具时确定，决定了下面要配哪些块：' +
        '走<b>推荐按钮</b>要配按钮文案与挂载位置；走<b>对话意图</b>要配喂给模型的意图描述。' +
        (t.channels.length === 2 ? '本工具<b>两条通路都走</b>，所以两组都要配。' : '') + '</span></div>' +
    '</div>' +

    '<div class="section-divider"></div>' +

    '<div class="sub-section"><div class="sub-head">工具用途 <span class="muted" style="text-transform:none;letter-spacing:0">双读者 · 别混写</span></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>给模型的描述 ' +
          (needLLM ? '<span class="badge amber">对话意图必填</span>' : '<span class="badge gray">本工具不走意图通路</span>') + '</label>' +
          '<textarea class="tpl-input" style="min-height:96px" ' + (needLLM ? '' : 'disabled ') +
            'oninput="setToolPurpose(\'llm\',this.value)">' + tEsc(cfg.llm) + '</textarea>' +
          '<div class="hint">这段是模型判断「要不要选这个工具」的唯一依据。<b>为它好懂而写得口语化，会直接拉低触发准确率</b>。</div></div>' +
        '<div class="field"><label>给用户的说明</label>' +
          '<textarea class="tpl-input" style="min-height:96px" oninput="setToolPurpose(\'user\',this.value)">' + tEsc(cfg.user) + '</textarea>' +
          '<div class="hint">前台工具卡片上展示的一句话，越短越好。</div></div>' +
      '</div>' +
    '</div>';

  /* 通路 A：推荐按钮 */
  if(chanOn(t, "推荐按钮")){
    html += '<div class="section-divider"></div>' +
      '<div class="sub-section"><div class="sub-head">通路 A · 推荐按钮</div><div class="grid3">' +
        '<div class="field"><label>按钮文案</label>' +
          '<input class="inp" value="' + tEsc(cfg.entry.button) + '" oninput="setToolEntry(\'button\',this.value)">' +
          '<div class="hint">用户点的那颗按钮上写什么</div></div>' +
        '<div class="field"><label>挂载页面</label>' +
          '<input class="inp" value="' + tEsc(cfg.entry.page) + '" oninput="setToolEntry(\'page\',this.value)">' +
          '<div class="hint">工具出现在哪个页面的工具区</div></div>' +
        '<div class="field"><label>展示位置</label>' +
          '<input class="inp" value="' + tEsc(cfg.entry.slot) + '" oninput="setToolEntry(\'slot\',this.value)">' +
          '<div class="hint">在该页工具区里的排布说明</div></div>' +
      '</div>' +
      '<div class="field" style="margin-top:12px"><label>触发器（只读）</label>' +
        '<div class="ro-mono"><span>on: ' + t.regName + ' · channel=button</span><span class="cp">⧉</span></div></div>' +
      '</div>';
  }

  /* 通路 B：对话意图 */
  if(chanOn(t, "对话意图")){
    html += '<div class="section-divider"></div>' +
      '<div class="sub-section"><div class="sub-head">通路 B · 对话意图</div>' +
        '<div class="field"><label>意图识别描述 <span class="badge amber">直接决定触发准确率</span></label>' +
          '<textarea class="tpl-input" oninput="setToolIntent(\'desc\',this.value)">' + tEsc(cfg.intent.desc) + '</textarea>' +
          '<div class="hint">写给模型看的。要包含「什么时候该用」，也要写清「什么时候不该用」——只写正面条件最容易误触发。</div></div>' +
        '<div class="grid2" style="margin-top:13px">' +
          '<div class="field"><label>示例问法 <span class="muted">注册表 · 只读</span></label>' +
            '<div class="opt-wrap" style="max-width:none">' +
              (t.intent.samples.length
                ? t.intent.samples.map(s => '<span class="ops">' + tEsc(s) + '</span>').join("")
                : '<span class="muted" style="font-size:13px">未登记示例</span>') + '</div>' +
            '<div class="hint">这些是回归测试用的固定问法，改动需研发登记</div></div>' +
          '<div class="field"><label>未命中时的追问话术</label>' +
            '<textarea class="tpl-input" oninput="setToolIntent(\'followUp\',this.value)">' + tEsc(cfg.intent.followUp) + '</textarea>' +
            '<div class="hint">意图匹配上了但参数不全时，模型该反问什么</div></div>' +
        '</div>' +
        '<div class="field" style="margin-top:12px"><label>触发器（只读）</label>' +
          '<div class="ro-mono"><span>on: intent.match · skill=' + t.regName + '</span><span class="cp">⧉</span></div></div>' +
      '</div>';
  }

  html += '</div></div>';
  return html;
}

function toolCard3(t, cfg){
  const mk = t.inputs.map(m => {
    const c = cfg.inputs.find(x => x.key === m.key);
    const avail = m.options && m.options.length
      ? '<div class="opt-wrap" style="max-width:none">' + m.options.map(o =>
          '<span class="ops' + ((Array.isArray(c.def) ? c.def.indexOf(o) : c.def) === o ? " now" : "") + '">' + tEsc(o) + '</span>').join("") + '</div>'
      : (m.type === "上传"
          ? '<div class="opt-wrap" style="max-width:none"><span class="ops now">JPG / PNG / PDF</span><span class="ops">≤ 20MB</span></div>'
          : '<span class="muted" style="font-size:13px">自由文本，无预设可选项</span>');

    let defCtrl;
    if(m.type === "上传") defCtrl = '<span class="muted" style="font-size:13.5px">由前端上传，无默认值</span>';
    else if(m.type === "多选"){
      const cur = c.def || [];
      defCtrl = '<div><span class="muted" style="font-size:13px">已选 ' + cur.length + ' 项</span>' +
        (cur.length ? '<div class="opt-wrap" style="max-width:none;margin-top:5px">' + cur.map(o => '<span class="ops now">' + tEsc(o) + '</span>').join("") + '</div>' : '') +
        '<div class="hint" style="margin-top:5px">在右侧点选可切换默认勾选项</div></div>';
    }
    else if(m.type === "文本") defCtrl = '<input class="inp" value="' + tEsc(c.def || "") + '" placeholder="无默认值 · 由用户输入" oninput="setInputDefault(\'' + m.key + '\',this.value)">';
    else defCtrl = '<select class="inp" onchange="setInputDefault(\'' + m.key + '\',this.value)">' + m.options.map(o =>
      '<option value="' + tEsc(o) + '"' + (c.def === o ? " selected" : "") + '>' + tEsc(o) + '</option>').join("") + '</select>';

    return '<div class="param-card"><div class="param-head">' +
      '<span class="param-label"><span>' + tEsc(m.label) + '</span>' +
        '<span class="key">' + tEsc(m.varName) + '</span>' +
        (m.required ? '<span class="req">必填</span>' : '') + '</span>' +
      '<span class="param-tags"><span class="badge gray">' + m.type + '</span></span>' +
      '<button class="eye' + (c.exposed ? " on" : "") + '" title="' + (c.exposed ? "已暴露给前台" : "不在前台展示") +
        '" onclick="toggleInputExpose(\'' + m.key + '\')">' + (c.exposed ? "◉" : "◌") + '</button>' +
      '</div>' +
      '<div class="param-body"><div class="field"><label>前端默认值</label>' + defCtrl + '</div>' +
        '<div class="field"><label>可选项 <span class="muted">注册表 · 只读</span></label>' +
          '<div onclick="toggleToolInputMulti(\'' + m.key + '\',event)">' + avail + '</div>' +
          '<div class="hint">可选项由研发注册的 schema 决定，运营只能改默认值和是否暴露</div></div>' +
      '</div>' +
      '<div class="param-foot"><span class="lbl">契约</span>' +
        '<span class="meta">' + tEsc(m.varName) + '</span>' +
        '<span class="muted" style="font-size:12.5px">模型按这个变量名取参，改名＝断调用</span></div>' +
    '</div>';
  }).join("");

  return '<div class="card"><div class="card-head"><span class="no">3</span><h2>入参与契约</h2>' +
    '<span class="sub">' + t.inputs.length + ' 个入参 · 结构只读 / 取值可配</span></div><div class="card-body">' +
    '<div class="fork-note" style="margin-bottom:13px"><span>ⓘ</span><span>入参分三层：<b>结构</b>（有哪些参、类型、是否必填）和<b>变量名</b>是契约，改了会断调用，只读；' +
      '<b>默认值</b>和<b>是否暴露给前台</b>是运营决策，可改。这和「模型功能」里的参数配置是同一套逻辑。</span></div>' +
    '<div style="display:flex;flex-direction:column;gap:10px">' + mk + '</div>' +
    '</div></div>';
}

function toolCard4(t, cfg){
  const blocks = TEXT_GROUPS.map(g => {
    const rows = rowsOf(g.key);
    const vs = varsOf(rows);
    return '<div class="sub-section"><div class="sub-head">' + g.label + '</div>' +
      '<div class="hint" style="margin-bottom:9px">' + g.hint + '</div>' +
      '<div>' + (rows.length
        ? rows.map((r, i) => '<div class="tpl-row">' +
            '<div class="tpl-case"><span>' + tEsc(r.c) + '</span>' +
              '<span class="del" title="删除该行" onclick="delTextRow(\'' + g.key + '\',' + i + ')">✕</span></div>' +
            '<div><textarea class="tpl-input" oninput="setText(\'' + g.key + '\',' + i + ',this.value)">' + tEsc(r.t) + '</textarea>' +
              (vs.length ? '<div class="hint" style="margin-top:5px">可用变量：' +
                vs.map(v => '<span class="tpl-var" onclick="copyVar(\'' + v + '\')">{' + v + '}</span>').join(" ") + '</div>' : '') +
            '</div></div>').join("")
        : '<div class="hint" style="padding:9px 0">该组暂无文案，点下方按钮新增一行</div>') +
      '</div>' +
      '<button class="mini-btn" style="margin-top:9px" onclick="addTextRow(\'' + g.key + '\')">' + g.add + '</button>' +
    '</div>' + (g.key === "inputErrors" ? "" : '<div class="section-divider"></div>');
  }).join("");

  return '<div class="card"><div class="card-head"><span class="no">4</span><h2>文案模板</h2>' +
    '<span class="sub">全部可配 · 支持 {变量} 插值</span></div><div class="card-body">' +
    '<div class="fork-note" style="margin-bottom:13px"><span>ⓘ</span><span>这四组是用户在异常路径上唯一看到的东西。' +
      '原表把它们写成「固定文本」，但固定意味着长任务只有一句「处理中」、所有异常共用一句话术 —— 用户只能自己猜。' +
      '建议至少把<b>进行中</b>按阶段拆开、把<b>常规异常</b>按类型分行。</span></div>' +
    blocks + '</div></div>';
}

function toolCard5(t, cfg){
  const statusMap = {
    synced: ['green', '已同步'],
    stale:  ['amber', '远端有新版本'],
    none:   ['gray', '未接入版本管理']
  };
  /* 用 toolStale 统一判定，避免「远端有更新 + 已同步」矛盾徽标 */
  const st = cfg.promptStatus === "none" ? statusMap.none
    : (toolStale(t.id) ? statusMap.stale : statusMap.synced);
  const versions = cfg.snaps.length
    ? '<select class="inp" style="max-width:170px" onchange="setPromptVersion(this.value)">' +
        cfg.snaps.map(s => '<option value="' + s.v + '"' + (s.v === cfg.version ? " selected" : "") + '>' + s.v + '</option>').join("") +
      '</select>'
    : '<span class="muted" style="font-size:13.5px">无历史版本</span>';

  const snaps = cfg.snaps.length
    ? '<div class="snap hd"><span>版本</span><span>发布说明</span><span>发布时间</span><span>操作人</span></div>' +
      cfg.snaps.map(s => '<div class="snap' + (s.cur ? " cur" : "") + '">' +
        '<span class="mono">' + s.v + (s.cur ? " ●" : "") + '</span>' +
        '<span class="muted">' + (s.cur ? "当前生效" : "历史版本") + '</span>' +
        '<span class="mono">' + s.ts + '</span>' +
        '<span class="muted">' + s.by + '</span></div>').join("")
    : '<div class="hint">该工具未接入版本管理，无发布快照可追溯。</div>';

  return '<div class="card"><div class="card-head"><span class="no">5</span><h2>版本与追溯</h2>' +
    '<span class="sub">只做指针 · 不承载提示词正文</span></div><div class="card-body">' +
    '<div class="fork-note" style="margin-bottom:13px"><span>ⓘ</span><span>提示词正文<b>不放这里</b>。版本管理、diff、审核、回滚在 ' +
      '<b>' + t.prompt.platform + '</b> 做，配置中心只负责回答一个问题：<b>线上现在跑的是哪一版</b>，以及出事时能追到哪一版。</span></div>' +
    '<div class="grid2 ver-grid"><div class="ver-box">' +
      '<div class="ver-line"><span class="k">维护平台</span><span class="v">' + tEsc(t.prompt.platform) + '</span></div>' +
      '<div class="ver-line"><span class="k">文件路径</span><span class="v">' + tEsc(t.prompt.path) + '</span></div>' +
      '<div class="ver-line"><span class="k">远端最新</span><span class="v">' + tEsc(cfg.remote) + '</span>' +
        (cfg.remote !== cfg.version ? '<span class="badge amber">有更新</span>' : '') + '</div>' +
      '<div class="ver-line"><span class="k">当前生效版本</span>' + versions + '</div>' +
      '<div class="ver-line"><span class="k">同步状态</span><span class="badge ' + st[0] + '">' + st[1] + '</span>' +
        '<span class="muted" style="font-size:12.5px">最近同步 ' + tEsc(t.prompt.syncedAt) + '</span></div>' +
      '<div class="ver-line" style="padding-top:10px">' +
        '<button class="mini-btn" onclick="checkPromptSync()">检查更新</button>' +
        '<button class="mini-btn" onclick="openPromptRepo()">前往维护平台 ↗</button></div>' +
    '</div>' +
    '<div><div class="block-cap">发布快照（用于追溯）</div>' + snaps + '</div></div>' +
    '</div></div>';
}

function renderToolPanel(){
  const panel = $("panel");
  if(!activeToolId){
    panel.innerHTML = '<div class="empty"><div class="big">◇</div>' +
      '<div style="font-size:15px;color:var(--text-2)">从左侧选择一个工具开始配置</div>' +
      '<div class="hint" style="margin-top:9px;max-width:430px;text-align:center">' +
      '这些是能被 AI 助手调用的工具与技能。它们不配模型槽位与积分 —— 通过「关联模型功能」继承；' +
      '这里配的是<b>唤得起来、说得清楚、错得不难看</b>。</div></div>';
    return;
  }
  const t = toolById(activeToolId), cfg = toolCfg();
  const head =
    crumbHTML(tEsc(cfg.name)) +
    '<div class="page-head"><div class="ph-title">' +
      '<h1>' + tEsc(cfg.name) + '</h1>' +
      '<span class="mk mono" style="font-size:12px;font-weight:400;color:var(--text-3)">' + t.id + '</span>' +
      '<span class="badge ' + (cfg.published ? "green" : "gray") + '">' + (cfg.published ? "已发布" : "未发布") + '</span>' +
      '<span class="badge ' + (cfg.status === "on" ? "blue" : (cfg.status === "gray" ? "amber" : "gray")) + '">' +
        (cfg.status === "on" ? "正式启用" : (cfg.status === "gray" ? "灰度中" : "已停用")) + '</span>' +
      (cfg.recommend ? '<span class="badge purple">前台推荐 #' + (cfg.rank || "—") + '</span>' : '') +
      '<span class="ph-score"><span class="k">触发通路</span><span class="v">' + t.channels.length + ' 条</span></span>' +
    '</div></div>';

  panel.innerHTML = head + toolCard1(t, cfg) + toolCard2(t, cfg) + toolCard3(t, cfg) + toolCard4(t, cfg) + toolCard5(t, cfg);
}

function updateToolActionStatus(){
  const bar = $("actionbar");
  if(OBJ === OBJ_TOOL && !activeToolId){ bar.style.display = "none"; return; }
  if(OBJ === OBJ_TOOL){
    const t = toolById(activeToolId), cfg = toolCfg();
    bar.style.display = "flex";
    $("actionStatus").innerHTML =
      '<span class="badge ' + (cfg.published ? "green" : "gray") + '">' + (cfg.published ? "已发布" : "草稿") + '</span>' +
      '<span>' + tEsc(cfg.name) + '</span><span style="opacity:.35">|</span>' +
      '<span>通路 ' + t.channels.join(" + ") + '</span><span style="opacity:.35">|</span>' +
      '<span>入参 ' + t.inputs.length + ' 个</span><span style="opacity:.35">|</span>' +
      '<span>版本 ' + cfg.version + '</span><span style="opacity:.35">|</span>' +
      '<span>' + (cfg.dirty ? '<span style="color:var(--warn)">● 有未保存修改</span>' : '已同步') + '</span>';
  }
}
/* -------- 九·三 工具配置交互 -------- */
function tMarkDirty(){ if(activeToolId) TOOL_STORE[activeToolId].dirty = true; updateToolActionStatus(); saveLocal(); }
function tRefreshAll(){ renderToolTree(); renderToolSbFoot(); renderToolPanel(); updateToolActionStatus(); }

function setToolName(v){
  const cfg = toolCfg(); cfg.name = v; tMarkDirty();
  renderToolTree();
  const h1 = document.querySelector(".ph-title h1");
  if(h1) h1.textContent = v;
}
function toggleToolRecommend(){
  const cfg = toolCfg();
  cfg.recommend = !cfg.recommend;
  if(cfg.recommend && !cfg.rank) cfg.rank = 1;
  tMarkDirty(); renderToolTree(); renderToolPanel();
}
function setToolRank(v){ toolCfg().rank = v === "" ? 0 : parseInt(v, 10) || 0; tMarkDirty(); }
function setToolStatus(v){ toolCfg().status = v; tMarkDirty(); renderToolPanel(); }
function toggleToolRole(r){
  const cfg = toolCfg(), i = cfg.roles.indexOf(r);
  if(i >= 0) cfg.roles.splice(i,1); else cfg.roles.push(r);
  tMarkDirty(); renderToolTree(); renderToolPanel();
}
function toggleToolGroup(g){
  const cfg = toolCfg(), i = cfg.groups.indexOf(g);
  if(i >= 0) cfg.groups.splice(i,1); else cfg.groups.push(g);
  tMarkDirty(); renderToolTree(); renderToolPanel();
}
function jumpToModel(fid){
  const f = featById(fid);
  if(!f){ toast("找不到关联的模型功能"); return; }
  setPage("model");
  selectFeature(fid);
  toast("已跳转到模型功能「" + f.name + "」");
}
function setToolPurpose(k, v){ toolCfg()[k] = v; tMarkDirty(); }
function setToolEntry(k, v){ toolCfg().entry[k] = v; tMarkDirty(); }
function setToolIntent(k, v){ toolCfg().intent[k] = v; tMarkDirty(); }
function setInputDefault(key, v){ inputCfg(key).def = v; tMarkDirty(); }
function toggleInputExpose(key){
  const c = inputCfg(key); c.exposed = !c.exposed;
  tMarkDirty(); renderToolPanel();
}
function toggleToolInputMulti(key, ev){
  const t = toolById(activeToolId), m = inputMeta(t, key);
  if(!m) return;
  const el = ev.target.closest ? ev.target.closest(".ops") : null;
  if(!el) return;
  const val = el.textContent.trim();
  const c = inputCfg(key);
  if(m.type === "多选"){
    const arr = c.def || [];
    const i = arr.indexOf(val);
    if(i >= 0) arr.splice(i,1); else arr.push(val);
    c.def = arr;
  } else if(m.type === "单选"){
    c.def = val;
  } else return;
  tMarkDirty(); renderToolPanel();
}
function setText(group, i, v){
  const rows = rowsOf(group);
  if(rows[i]){ rows[i].t = v; tMarkDirty(); }
}
function delTextRow(group, i){ rowsOf(group).splice(i,1); tMarkDirty(); renderToolPanel(); }
function addTextRow(group){
  const seed = {missing:"新场景", progress:"新阶段", errors:"新异常类型", inputErrors:"新错误情况"}[group] || "新场景";
  rowsOf(group).push({c:seed, t:""});
  tMarkDirty(); renderToolPanel();
}
function copyVar(v){
  const s = "{" + v + "}";
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).catch(function(){});
  toast("已复制变量 " + s);
}
function setPromptVersion(v){
  const cfg = toolCfg();
  cfg.version = v;
  /* 版本指针手动回退/前移都要联动同步状态，否则出现「有更新 + 已同步」矛盾徽标 */
  cfg.promptStatus = (cfg.promptStatus === "none" || cfg.remote === v) ? "synced" : "stale";
  tMarkDirty(); renderToolTree(); renderToolSbFoot(); renderToolPanel();
}
function checkPromptSync(){
  const cfg = toolCfg();
  if(cfg.promptStatus === "none"){ toast("该工具未接入版本管理，无法检查更新"); return; }
  if(cfg.remote === cfg.version){ toast("已是最新版本（" + cfg.version + "）"); return; }
  const from = cfg.version;
  cfg.snaps.forEach(x => { x.cur = false; });
  cfg.snaps.unshift({v:cfg.remote, ts:nowStamp(), by:"当前账号", cur:true});
  cfg.version = cfg.remote;
  cfg.promptStatus = "synced";
  tMarkDirty(); renderToolTree(); renderToolSbFoot(); renderToolPanel();
  toast("已从 " + from + " 同步到 " + cfg.remote);
}
function nowStamp(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* —— 核心：切换模型 → 参数可选项联动 —— */
function setSlot(key, modelId){
  const f = featById(activeId), cfg = STORE[f.id], tpl = tplOf(f);
  const before = mergedCaps(f);
  cfg.slots[key] = modelId;
  const after = mergedCaps(f);

  const changes = [];
  const keys = Object.keys(before).concat(Object.keys(after)).filter((v,i,a) => a.indexOf(v) === i);
  keys.forEach(k => {
    const a = before[k], b = after[k];
    if(Array.isArray(a) || Array.isArray(b)){
      const aa = Array.isArray(a) ? a : [], bb = Array.isArray(b) ? b : [];
      const add = bb.filter(x => aa.indexOf(x) < 0);
      const del = aa.filter(x => bb.indexOf(x) < 0);
      if(add.length) changes.push(k + ' 新增 ' + add.map(fmtOpt).join("、"));
      if(del.length) changes.push(k + ' 移除 ' + del.map(fmtOpt).join("、"));
    } else if(a !== b){
      changes.push(k + ' ' + fmtOpt(a) + ' → ' + fmtOpt(b));
    }
  });

  /* 已配置值越界自动回落 */
  const resets = [];
  lastDiffParams = {};
  keys.forEach(k => {
    const aa = Array.isArray(before[k]) ? before[k] : [];
    const bb = Array.isArray(after[k]) ? after[k] : [];
    const add = bb.filter(x => aa.indexOf(x) < 0);
    if(add.length) tpl.params.forEach(p => { if(p.cap === k) lastDiffParams[p.key] = {added:add}; });
  });
  tpl.params.forEach(p => {
    const opts = paramOptions(f, p);
    const v = cfg.params[p.key];
    if(p.ctrl === "switch"){
      if(opts === null && v === true){ cfg.params[p.key] = false; resets.push(p.label + ' → 关'); }
      return;
    }
    if(opts === null) return;
    if(Array.isArray(opts) && Array.isArray(v)){
      const keep = v.filter(x => opts.indexOf(x) >= 0);
      if(keep.length !== v.length){
        cfg.params[p.key] = keep.length ? keep : [opts[0]];
        resets.push(p.label + ' → ' + cfg.params[p.key].join("、"));
      }
    } else if(Array.isArray(opts) && opts.length && p.ctrl === "select" && opts.indexOf(v) < 0){
      cfg.params[p.key] = opts[0]; resets.push(p.label + ' → ' + opts[0]);
    } else if(opts && opts.max !== undefined && Number(v) > opts.max){
      cfg.params[p.key] = opts.max; resets.push(p.label + ' → ' + opts.max);
    }
  });

  const m = modelById(modelId);
  lastDiff = '<b>已切换至 ' + (m ? m.name : "—") + '</b>（档位 ×' + (m ? m.tier.toFixed(2) : "—") + '）· ' +
    (changes.length ? '能力变化：' + changes.slice(0,6).join("；") + (changes.length > 6 ? ' 等 ' + changes.length + ' 项' : '')
                    : '能力矩阵无变化') +
    (resets.length ? '<br><b>已自动回落：</b>' + resets.join("；") : '');
  markDirty(activeId);
  refresh();
}
function fmtOpt(v){
  if(v === true) return "支持";
  if(v === false) return "不支持";
  if(v === undefined) return "—";
  return String(v);
}
/* 局部刷新，避免输入框失焦 */
function updateCalcOnly(){
  const f = featById(activeId), panel = $("panel");
  const stepsEl = panel.querySelector(".steps");
  if(!stepsEl){ renderPanel(); return; }
  const calc = calculate(f), r = creditRange(f), cost = unitCost(f);
  const revenue = calc.total * POINT_TO_YUAN;
  stepsEl.innerHTML = stepsHTML(calc);
  const box = panel.querySelector(".result-box");
  if(box){
    box.querySelector(".n").textContent = calc.total;
    const bs = box.querySelectorAll(".rm b");
    const margin = revenue - cost;
    if(bs.length >= 4){
      bs[0].textContent = "¥" + revenue.toFixed(3); bs[0].className = "pos";
      bs[1].textContent = "−¥" + cost.toFixed(3);   bs[1].className = "neg";
      bs[2].textContent = (margin>=0?"+":"−") + "¥" + Math.abs(margin).toFixed(3);
      bs[2].className = margin>=0 ? "pos" : "neg";
      bs[3].textContent = revenue>0 ? (margin/revenue*100).toFixed(1) + "%" : "—";
      bs[3].className = margin>=0 ? "pos" : "neg";
    }
    const loss = box.querySelector(".loss");
    if(loss){ loss.innerHTML = lossText(margin, cost); loss.classList.toggle("show", margin < 0); }
  }
  const rs = $("rateSub");
  if(rs) rs.textContent = "1 积分 = ¥" + POINT_TO_YUAN.toFixed(3);
  const rn = panel.querySelector(".range-note .rng");
  if(rn) rn.textContent = r[0] + " – " + r[1] + " 分";
  const big = panel.querySelector(".ph-score .v");
  if(big) big.textContent = r[0] + " – " + r[1];
  const pv = panel.querySelector(".front-preview");
  if(pv) pv.outerHTML = frontPreviewHTML(f);
}

/* =========================================================================
   十一、快照 / 发布 / 回滚
   ========================================================================= */
function snapshot(fid, label){
  const f = featById(fid), cfg = STORE[fid], tpl = tplOf(f);
  const lines = ['功能：' + f.name];
  tpl.slots.forEach(s => {
    const m = modelById(cfg.slots[s.key]);
    lines.push(s.label + '：' + (m ? m.name + '（×' + m.tier.toFixed(2) + '）' : '未选'));
  });
  lines.push('功能基础分：' + f.base);
  tpl.params.forEach(p => {
    if(!paramVisible(f,p) || !paramSupported(f,p)) return;
    const v = cfg.params[p.key];
    lines.push('  · ' + p.label + ' = ' + (Array.isArray(v) ? v.join("/") : v));
  });
  const r = creditRange(f);
  lines.push('积分区间：' + r[0] + ' – ' + r[1] + ' 分');
  lines.push('开放角色：' + (f.roles.join("、") || "未分配"));
  return {
    label, ts:new Date().toLocaleString("zh-CN",{hour12:false}), lines,
    state:{
      slots: JSON.parse(JSON.stringify(cfg.slots)),
      params: JSON.parse(JSON.stringify(cfg.params)),
      expose: JSON.parse(JSON.stringify(cfg.expose)),
      base: f.base, roles: f.roles.slice(), groups: f.groups.slice()
    }
  };
}
function pushHistory(fid, label){
  if(!HISTORY[fid]) HISTORY[fid] = [];
  HISTORY[fid].unshift(snapshot(fid, label));
  if(HISTORY[fid].length > 20) HISTORY[fid].pop();
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 1900);
  saveLocal();
}
function updateActionStatus(){

      (rows.length
        ? '<div class="snap hd"><span>版本</span><span>说明</span><span>发布时间</span><span>操作人</span></div>' +
          rows.map(x => '<div class="snap' + (x.cur ? " cur" : "") + '"><span class="mono">' + x.v + '</span>' +
            '<span class="muted">' + (x.cur ? "当前生效" : "历史版本") + '</span>' +
            '<span class="mono">' + x.ts + '</span><span class="muted">' + x.by + '</span></div>').join("")
        : '<div class="hint">该工具未接入版本管理，无快照可追溯。</div>') +
      '<div class="block-cap" style="margin:18px 0 10px">当前配置</div>' +
      '<div class="hist"><div class="hist-top"><b>' + tEsc(cfg.name) + '</b>' +

  const f = featById(activeId);
  const list = HISTORY[activeId] || [];
  $("drawerBody").innerHTML = list.length ? list.map((h,i) =>
    '<div class="hist"><div class="hist-top"><b>' + h.label + '</b><span class="ts">' + h.ts + '</span></div>' +
    '<div class="hist-diff">' + h.lines.map(l => l.replace(/</g,"&lt;")).join("\n") + '</div>' +

      f.name + ' 暂无历史快照<br>发布或保存草稿后会生成快照</div>';
}
function rollback(i){
  const h = HISTORY[activeId][i];
  if(!h || !h.state) return;
  pushHistory(activeId, "回滚前自动快照");
  const f = featById(activeId), cfg = STORE[activeId];
  cfg.slots  = JSON.parse(JSON.stringify(h.state.slots));
  cfg.params = JSON.parse(JSON.stringify(h.state.params));
  cfg.expose = JSON.parse(JSON.stringify(h.state.expose));
  cfg.base = h.state.base; f.base = h.state.base;
  f.roles = h.state.roles.slice();
  f.groups = h.state.groups.slice();
  cfg.published = true; cfg.dirty = false;
  lastDiff = ""; lastDiffParams = {};
  toast("已回滚到「" + h.label + "」");
  renderHistory(); refresh();
}

   十一·五、一级页签路由（按维护人拆分五页）

const PAGES = ["catalog","model","billing","tools","publish"];
let PAGE = "catalog";
let showDisabled = false;

/* —— UX 重构：页名映射 / 跨页跳转来源 / 面板淡入 / 自动选中 —— */
const PAGE_LABELS = {catalog:"功能目录", model:"模型参数配置", billing:"积分配置", tools:"助手工具", publish:"发布与追溯"};
let navCtx = null; /* 跨页跳转来源页，用于页头「来自 xx · 返回」提示；点页签即清除 */
function crumbHTML(here){
  let fromHtml = "";
  if(navCtx && navCtx.from && navCtx.from !== PAGE)
    fromHtml = '<span class="from">来自「' + PAGE_LABELS[navCtx.from] + '」' +
      '<button class="mini-btn" onclick="goBackNav()">返回</button></span>';
  return '<div class="crumb"><span class="loc">' + PAGE_LABELS[PAGE] + '</span><span class="sep">/</span>' +
    (here ? '<span class="here">' + here + '</span>' : '') + fromHtml + '</div>';

function goBackNav(){
  const from = navCtx ? navCtx.from : "catalog";
  navCtx = null;
  setPage(from);
  toast("已返回「" + PAGE_LABELS[from] + "」");
}
/* 面板内容淡入（仅 transform/opacity），页签切换与功能切换时触发 */
function flashPanel(){
  const p = $("panel");
  p.classList.remove("anim");
  void p.offsetWidth;
  p.classList.add("anim");
}
/* 清空搜索与全部筛选 chips（空态中的出口按钮用） */
function clearFilters(){
  filters.q = ""; filters.group = ""; filters.role = "";
  $("searchInput").value = "";
  renderGroupChips(); renderRoleChips(); refresh();
}
function toolHitList(){
  return TOOLS.filter(matchToolFilter)
    .filter(t => !filters.group || TOOL_STORE[t.id].groups.indexOf(filters.group) >= 0)
    .filter(t => !filters.role  || TOOL_STORE[t.id].roles.indexOf(filters.role)  >= 0);
}
/* 首屏即内容：进入功能页时若无选中项，自动选中筛选结果里的第一个功能 */
function ensureAutoFeature(){
  if(activeId && featById(activeId)) return;
  const hit = FEATURES.filter(matchFilter);
  if(hit.length) activeId = hit[0].id;
  else if(FEATURES.length) activeId = FEATURES[0].id;
  lastDiff = ""; lastDiffParams = {};
}
/* 同理：进入工具页时自动选中第一个工具 */
function ensureAutoTool(){
  if(activeToolId && toolById(activeToolId)) return;
  const hit = toolHitList();
  if(hit.length) activeToolId = hit[0].id;
  else if(TOOLS.length) activeToolId = TOOLS[0].id;
}

  document.body.dataset.page = p;
  document.querySelectorAll(".page-tab").forEach(el => el.classList.toggle("on", el.dataset.page === p));

function modal(title, bodyHTML, okLabel, onok){
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = bodyHTML;
  $("modalOk").textContent = okLabel || "确定";
  $("modalOk").onclick = () => { if(modalOkHandler) modalOkHandler(); };

}

  let mx = 0;
  FEATURES.forEach(f => { const m = /^f(\d+)$/.exec(f.id); if(m) mx = Math.max(mx, Number(m[1])); });
  return "f" + (mx + 1);
}

function saveEditFeature(fid){

  const groups = Array.prototype.map.call(document.querySelectorAll("#ffGroups .tick.on"), el => el.dataset.g);

function saveNewFeature(){

function dictUsage(kind, name){
  let n = 0;
  FEATURES.forEach(f => {
    const a = kind === "g" ? f.groups : f.roles;
    (a || []).forEach(x => { if(x === name) n++; });
  });
  Object.keys(TOOL_STORE).forEach(k => {
    const c = TOOL_STORE[k];
    const a = kind === "g" ? (c.groups || []) : (c.roles || []);
    a.forEach(x => { if(x === name) n++; });
  });
  return n;
}
function dictRow(kind, name, idx){
  const n = dictUsage(kind, name);
  const isUngrouped = (kind === "g" && name === "未分组");
  return '<div class="dict-row">' +
    '<input class="inp" value="' + name + '" onchange="renameDict(\'' + kind + '\',\'' + name + '\',this.value)">' +
    '<span class="cnt">' + n + ' 处引用</span>' +
    '<button class="mini-btn"' + (idx === 0 ? " disabled" : "") + ' onclick="moveDict(\'' + kind + '\',\'' + name + '\',-1)">↑</button>' +
    '<button class="mini-btn" onclick="moveDict(\'' + kind + '\',\'' + name + '\',1)">↓</button>' +
    '<button class="mini-btn"' + ((n > 0 || isUngrouped) ? " disabled" : "") + ' onclick="delDict(\'' + kind + '\',\'' + name + '\')">删除</button>' +
  '</div>';
}
function dictHTML(){
  return '<div class="block-cap">分组（决定目录与前台导航位置）</div>' +
    GROUPS.map((g,i) => dictRow("g", g, i)).join("") +

/* 字典弹窗可开在两层：1 = 独立弹窗；2 = 「新增/编辑功能」之上再叠一层，改完不丢已填内容 */
let DICT_LAYER = 1;

/* 字典变更后，把还开着的「新增/编辑功能」表单里的 chips 重建，重命名时保留已选项 */
function syncFeatureFormTicks(kind, from, to){
  const g = $("ffGroups"), r = $("ffRoles");
  if(!g || !r) return;
  const pickG = Array.prototype.map.call(g.querySelectorAll(".tick.on"), t => t.dataset.g)
    .map(v => (kind === "g" && from && v === from) ? to : v);
  const pickR = Array.prototype.map.call(r.querySelectorAll(".tick.on"), t => t.dataset.r)
    .map(v => (kind === "r" && from && v === from) ? to : v);
  g.innerHTML = GROUPS.filter(x => x !== "未分组").map(x =>
    '<span class="tick' + (pickG.indexOf(x) >= 0 ? " on" : "") + '" data-g="' + tEsc(x) + '" onclick="this.classList.toggle(\'on\')"><i></i>' + tEsc(x) + '</span>').join("") +
    '<button type="button" class="tick-add" onclick="openDictStacked()" title="新增 / 重命名 / 排序 / 删除分组">＋ 管理分组</button>';
  r.innerHTML = ROLES.map(x =>
    '<span class="tick' + (pickR.indexOf(x) >= 0 ? " on" : "") + '" data-r="' + tEsc(x) + '" onclick="this.classList.toggle(\'on\')"><i></i>' + tEsc(x) + '</span>').join("");
}
function dictCascade(kind, oldName, newName){
  FEATURES.forEach(f => {
    const a = kind === "g" ? f.groups : f.roles;
    const i = (a || []).indexOf(oldName);
    if(i >= 0) a[i] = newName;
  });
  TOOLS.forEach(t => {
    const a = kind === "g" ? t.groups : t.roles;
    const i = (a || []).indexOf(oldName);
    if(i >= 0) a[i] = newName;
  });
  Object.keys(TOOL_STORE).forEach(k => {
    const c = TOOL_STORE[k];
    const a = kind === "g" ? c.groups : c.roles;
    const i = (a || []).indexOf(oldName);
    if(i >= 0) a[i] = newName;
  });
  if(kind === "g" && filters.group === oldName) filters.group = newName;
  if(kind === "r" && filters.role === oldName) filters.role = newName;
}
function renameDict(kind, oldName, newName){
  newName = (newName || "").trim();
  const arr = kind === "g" ? GROUPS : ROLES;
  if(!newName || newName === oldName){ openDictModal(); return; }
  if(arr.indexOf(newName) >= 0){ toast("「" + newName + "」已存在"); openDictModal(); return; }
  arr[arr.indexOf(oldName)] = newName;
  dictCascade(kind, oldName, newName);
  saveLocal(); renderGroupChips(); renderRoleChips(); renderDict();
  syncFeatureFormTicks(kind, oldName, newName);
  refresh();
  toast("已重命名为「" + newName + "」，所有引用同步更新");
}
function delDict(kind, name){
  if(dictUsage(kind, name) > 0){ toast("「" + name + "」仍被引用，不能删除"); return; }
  const arr = kind === "g" ? GROUPS : ROLES;
  const i = arr.indexOf(name);
  if(i < 0) return;
  arr.splice(i, 1);
  if(kind === "g" && filters.group === name) filters.group = "";
  if(kind === "r" && filters.role === name) filters.role = "";
  saveLocal(); renderGroupChips(); renderRoleChips(); renderDict();
  syncFeatureFormTicks();
  refresh();
  toast("已删除「" + name + "」");
}
function moveDict(kind, name, dir){
  const arr = kind === "g" ? GROUPS : ROLES;
  const i = arr.indexOf(name), j = i + dir;
  if(i < 0 || j < 0 || j >= arr.length) return;
  if(arr[i] === "未分组" || arr[j] === "未分组") return;
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  saveLocal(); renderGroupChips(); renderDict(); syncFeatureFormTicks(); refresh();
}
function addDict(kind){
  const input = $(kind === "g" ? "newDictG" : "newDictR");
  const name = (input.value || "").trim();
  const arr = kind === "g" ? GROUPS : ROLES;
  if(!name){ toast("请输入名称"); return; }
  if(arr.indexOf(name) >= 0){ toast("「" + name + "」已存在"); return; }
  if(kind === "g"){
    const gi = arr.indexOf("未分组");
    arr.splice(gi >= 0 ? gi : arr.length, 0, name);
  } else arr.push(name);
  saveLocal(); renderGroupChips(); renderRoleChips(); renderDict();
  syncFeatureFormTicks();
  refresh();
  toast("已新增" + (kind === "g" ? "分组" : "角色") + "「" + name + "」");
}

      boardStat("积分汇率", '<input class="inp" type="number" step="0.01" min="0.001" value="' + POINT_TO_YUAN + '" oninput="setRate(this.value)" style="max-width:110px;height:30px"> <small>元 / 积分</small>') +

            '<td><b>' + f.name + '</b> <span class="muted">' + f.id + '</span></td>' +

            '<td style="color:var(--danger)">−¥' + Math.abs(rev - cost).toFixed(3) + '</td>' +
            '<td>' + Math.ceil(cost / POINT_TO_YUAN) + ' 分</td></tr>';
        }).join("") + '</tbody></table>'
      : '<div class="hint">当前汇率下没有亏损功能。</div>') +
  '</div></div>';
}

   十一·九、本地自动保存 + 全量导入导出
   ========================================================================= */
const LS_KEY = "jjszt_ai_cfg_v1";
let autoSave = true, saveTimer = null;
function snapshotState(){
  return {v:1, savedAt: nowStamp(), rate: POINT_TO_YUAN,
    groups: GROUPS.slice(), roles: ROLES.slice(),
    features: FEATURES.map(f => ({def:f, cfg:STORE[f.id], hist:HISTORY[f.id] || []})),
    tools: TOOLS.map(t => ({id:t.id, cfg:TOOL_STORE[t.id]}))};
}
function saveLocal(){
  if(!autoSave) return;
  const dot = $("saveDot"), txt = $("saveTxt");
  if(dot) dot.classList.add("busy");
  if(txt) txt.textContent = "保存中…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshotState())); }catch(e){}
    if(dot) dot.classList.remove("busy");
    if(txt) txt.textContent = "已自动保存 " + nowStamp().slice(11);
  }, 500);
}
function applyState(data){
  if(data.groups && data.groups.length) GROUPS = data.groups.slice();
  if(data.roles && data.roles.length) ROLES = data.roles.slice();
  if(Number(data.rate) > 0) POINT_TO_YUAN = Number(data.rate);
  FEATURES.length = 0;
  Object.keys(STORE).forEach(k => delete STORE[k]);
  Object.keys(HISTORY).forEach(k => delete HISTORY[k]);
  (data.features || []).forEach(x => {
    const f = JSON.parse(JSON.stringify(x.def));
    if(!TEMPLATES[f.tpl]) f.tpl = Object.keys(TEMPLATES)[0];
    FEATURES.push(f);
    STORE[f.id] = x.cfg || makeConfig(f);
    HISTORY[f.id] = x.hist || [];
  });
  (data.tools || []).forEach(x => { if(TOOL_STORE[x.id]) TOOL_STORE[x.id] = x.cfg; });
  activeId = FEATURES.length ? FEATURES[0].id : null;
  lastDiff = ""; lastDiffParams = {};
  renderGroupChips(); renderRoleChips(); updateTabCounts();
  refresh();
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || data.v !== 1 || !Array.isArray(data.features) || !data.features.length) return false;
    applyState(data);
    return true;
  }catch(e){ return false; }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(snapshotState(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ai-config-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  toast("已导出全量配置（" + FEATURES.length + " 个功能 + " + TOOLS.length + " 个工具）");
}
function importJSON(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      if(!data || data.v !== 1 || !Array.isArray(data.features) || !data.features.length)
        throw new Error("不是本系统导出的配置文件");
      applyState(data);
      saveLocal();
      toast("已导入配置（" + data.features.length + " 个功能）");
    }catch(e){ toast("导入失败：" + e.message); }
    input.value = "";
  };
  rd.readAsText(file);
}
function toggleAutoSave(){
  autoSave = !autoSave;
  if(autoSave) saveLocal();
  if(PAGE === "publish") renderPanel();
  toast(autoSave ? "已开启自动保存" : "已关闭自动保存（改动仅存在于当前页面）");
}
function clearLocal(){
  modal("清空本地存档？",
    '<div class="hint" style="font-size:13.5px;line-height:1.7">将删除本浏览器自动保存的全部配置，页面恢复到代码内置的出厂状态。此操作不可撤销，建议先「导出全量配置 JSON」备份。</div>',
    "确认清空", () => {
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      location.reload();
    });
}

/* =========================================================================
   十二、启动
   ========================================================================= */
FEATURES.forEach(f => { STORE[f.id] = makeConfig(f); });
TOOLS.forEach(t => { TOOL_STORE[t.id] = makeToolConfig(t); });
/* 预置：报关录单已发布；经营分析以前台推荐方式已发布 */
TOOL_STORE["t01"].published = true;
TOOL_STORE["t04"].published = true;
/* 「首尾帧生视频」的默认模型落在支持首尾帧的模型上（候选池已按能力过滤） */
STORE["f34"].slots.main = "kling-o3";
/* 预置两条历史便于演示回滚 */
pushHistory("f11", "初始配置");
STORE["f11"].published = true;

const loadedFromLocal = loadLocal();
renderGroupChips();
renderRoleChips();
setPage("catalog");
if(loadedFromLocal) toast("已从本地存档恢复上次配置");

document.querySelectorAll(".page-tab").forEach(el => el.onclick = () => { navCtx = null; setPage(el.dataset.page); });
$("showDisabledChk").onchange = function(){
  showDisabled = this.checked;
  this.closest(".show-disabled").classList.toggle("on", showDisabled);
  refresh();
};
$("searchInput").oninput = function(){ filters.q = this.value; refresh(); };
/* Esc 清空搜索框；搜索框未聚焦时 Esc 关闭弹窗 / 抽屉 */
$("searchInput").addEventListener("keydown", function(e){
  if(e.key === "Escape" && this.value){
    this.value = ""; filters.q = ""; refresh();
    e.stopPropagation();
  }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if($("modalMask2").classList.contains("open")){ closeModal2(); return; }
  if($("modalMask").classList.contains("open")){ closeModal(); return; }
  if($("drawer").classList.contains("open")){
    $("drawer").classList.remove("open"); $("drawerMask").classList.remove("open");
  }
});
$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
$("btnDraft").onclick = () => {
  if(OBJ === OBJ_TOOL){
    if(!activeToolId) return;
    TOOL_STORE[activeToolId].dirty = false;
    toast("草稿已保存，快照已生成");
    updateToolActionStatus();
    return;
  }
  if(!activeId) return;
  STORE[activeId].dirty = false;
  pushHistory(activeId, "保存草稿");
  toast("草稿已保存，快照已生成");
  updateActionStatus();
};
$("btnPublish").onclick = () => {
  if(OBJ === OBJ_TOOL){
    if(!activeToolId) return;
    const cfg = toolCfg();
    if(cfg.roles.length === 0){ toast("该工具未分配开放角色，无法发布"); return; }
    if(toolStale(activeToolId)){ toast("提示词版本落后于远端，请先同步再发布"); return; }
    cfg.published = true; cfg.dirty = false;
    toast("「" + cfg.name + "」已发布上线");
    refresh();
    return;
  }
  if(!activeId) return;
  const f = featById(activeId);
  if(f.roles.length === 0){ toast("该功能未分配开放角色，无法发布"); return; }
  if(tplOf(f).slots.some(s => !STORE[activeId].slots[s.key])){ toast("存在未选择模型的槽位，无法发布"); return; }
  STORE[activeId].published = true;
  STORE[activeId].dirty = false;
  pushHistory(activeId, "发布上线");
  toast("「" + f.name + "」已发布上线");
  refresh();
};
$("btnReset").onclick = () => {
  if(OBJ === OBJ_TOOL){
    if(!activeToolId) return;
    TOOL_STORE[activeToolId] = makeToolConfig(toolById(activeToolId));
    toast("已还原为默认配置");
    refresh();
    return;
  }
  if(!activeId) return;
  STORE[activeId] = makeConfig(featById(activeId));
  lastDiff = ""; lastDiffParams = {};
  toast("已还原为默认配置");
  refresh();
};
$("btnHistory").onclick = () => { renderHistory(); $("drawer").classList.add("open"); $("drawerMask").classList.add("open"); };
$("drawerClose").onclick = () => { $("drawer").classList.remove("open"); $("drawerMask").classList.remove("open"); };
$("drawerMask").onclick = () => { $("drawer").classList.remove("open"); $("drawerMask").classList.remove("open"); };
</script>
</body>
</html>
